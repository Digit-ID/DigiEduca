               '<rect x="'+(x+32)+'" y="'+(y+23)+'" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#B4C2D2" stroke-width="1.2"/>' +
               '<path d="M '+(x+42)+' '+(y+25)+' a 3.5 3.5 0 0 1 0 6" fill="none" stroke="#B4C2D2" stroke-width="1.4"/>' +
               '<path d="M '+(x+35)+' '+(y+20)+' q 1.5 -2 0 -4 M '+(x+39)+' '+(y+20)+' q 1.5 -2 0 -4" fill="none" stroke="#B4C2D2" stroke-width="1" stroke-linecap="round"/>';
        }
        d += '</g>';
        const lbl = cell.kind==="tv" ? "" : (cell.kind==="wc" ? "WC" : "COPA");
        if(lbl) topLayer += '<text x="'+(x+29)+'" y="'+(y+52)+'" font-size="7.5" font-weight="800" fill="#8B97A5" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="1">'+lbl+'</text>';
        d += '</g>';
        el += d;
        continue;
      }
      if(cell.kind==="plant"){
        el += '<g'+click+(opts.parkOnly?' opacity="0.15"':'')+'><rect x="'+(x+3)+'" y="'+(y+3)+'" width="'+(CS-6)+'" height="'+(CS-6)+'" rx="8" fill="rgba(0,0,0,0)"/>' +
          '<circle cx="'+(x+29)+'" cy="'+(y+24)+'" r="13" fill="#7FC69A"/>' +
          '<circle cx="'+(x+21)+'" cy="'+(y+29)+'" r="8" fill="#5EAF7F"/>' +
          '<circle cx="'+(x+37)+'" cy="'+(y+29)+'" r="8" fill="#93D1A9"/>' +
          '<path d="M '+(x+21)+' '+(y+38)+' h 16 l -2.5 11 h -11 Z" fill="#B98A5E"/></g>';
        continue;
      }
      if(cell.kind==="label"){
        const lw = (cell.w||1)*CS, lh = (cell.h||1)*CS;
        const pe = opts.admin ? '' : ' pointer-events="none"';
        el += '<g'+(opts.admin?click:'')+pe+(opts.parkOnly?' opacity="0.2"':'')+'>' +
          '<rect x="'+(x+2)+'" y="'+(y+2)+'" width="'+(lw-4)+'" height="'+(lh-4)+'" rx="6" fill="rgba(31,111,235,.045)"'+(opts.admin?' stroke="#E4E7EC" stroke-dasharray="3 3"':'')+'/>' +
          '<text x="'+(x+lw/2)+'" y="'+(y+lh/2+4)+'" font-size="11" font-weight="700" fill="#8B97A5" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="1">'+esc(cell.text||"ZONA")+'</text></g>';
        continue;
      }

      const sp = byPos[key];
      if(!sp) continue;

      if(cell.kind==="park"){
        const b = day[sp.id];
        const mine = b && canManage(b);
        const st = sp.blocked ? "other" : (b ? (mine?"mine":"other") : "free");
        let g = '<g'+(opts.admin?click:(sp.blocked||(b&&!mine)?'':' onclick="openBookModal(\''+sp.id+'\')" style="cursor:pointer"'))+'>';
        g += '<rect x="'+(x+4)+'" y="'+(y+3)+'" width="'+(CS-8)+'" height="'+(CS-6)+'" rx="7" fill="'+(sp.blocked?"#EDEDF2":"#F4F6F9")+'" stroke="#8B97A5" stroke-dasharray="5 3" stroke-width="1.4"/>';
        g += '<text x="'+(x+11)+'" y="'+(y+15)+'" font-size="10" font-weight="800" fill="#8B97A5" font-family="Calibri,sans-serif">'+sp.label+'</text>';
        if(sp.blocked){
          g += '<text x="'+(x+29)+'" y="'+(y+32)+'" font-size="14" text-anchor="middle">🔒</text>';
          if(sp.blockedBy) g += '<text x="'+(x+29)+'" y="'+(y+46)+'" font-size="7" font-weight="700" fill="#8B97A5" text-anchor="middle" font-family="Calibri,sans-serif">'+esc(firstName(sp.blockedBy))+'</text>';
        } else if(b){
          const carC = mine ? COL.mine : "#8B97A5";
          g += '<rect x="'+(x+15)+'" y="'+(y+19)+'" width="28" height="32" rx="9" fill="'+carC+'"/>' +
               '<rect x="'+(x+19)+'" y="'+(y+24)+'" width="20" height="8" rx="3" fill="rgba(255,255,255,.75)"/>' +
               '<circle cx="'+(x+20)+'" cy="'+(y+50)+'" r="3" fill="#3A3F55"/><circle cx="'+(x+38)+'" cy="'+(y+50)+'" r="3" fill="#3A3F55"/>' +
               '<text x="'+(x+29)+'" y="'+(y+44)+'" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">'+esc(shortName(occupantOf(b)))+'</text>';
          if(b.visitor) g += '<rect x="'+(x+4)+'" y="'+(y-1)+'" width="20" height="10" rx="5" fill="#3E9E70"/><text x="'+(x+14)+'" y="'+(y+6.5)+'" font-size="6.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">VIS</text>';
          if(b.checkedIn) g += '<circle cx="'+(x+48)+'" cy="'+(y+48)+'" r="6" fill="#3E9E70"/><text x="'+(x+48)+'" y="'+(y+51)+'" font-size="8" fill="#fff" text-anchor="middle">✓</text>';
        }
        g += statusDot(x+46, y+10, st, st);
        g += '</g>';
        el += g;
        continue;
      }

      /* secretária */
      if(opts.heat){
        const u = opts.heat.usage[sp.id]||0;
        const t = u / opts.heat.max;
        const heatFill = u===0 ? "#F1F2F6" : "rgb("+Math.round(241-(241-31)*t)+","+Math.round(242-(242-111)*t)+","+Math.round(246-(246-235)*t)+")";
        const DIRH = {s:0, w:90, n:180, e:270};
        const angH = DIRH[sp.dir||"s"] || 0;
        let hg = '<g>';
        hg += '<g'+(angH?' transform="rotate('+angH+' '+(x+29)+' '+(y+29)+')"':'')+'>';
        hg += '<rect x="'+(x+6)+'" y="'+(y+7)+'" width="46" height="25" rx="5" fill="'+heatFill+'" stroke="#CBD5E0" stroke-width="1.5"/>';
        hg += '<circle cx="'+(x+29)+'" cy="'+(y+43)+'" r="8" fill="#D0D8E2"/>';
        hg += '</g>';
        hg += '<text x="'+(x+29)+'" y="'+(y+23)+'" font-size="9" font-weight="800" fill="'+(t>0.55?"#fff":"#0E182B")+'" text-anchor="middle" font-family="Calibri,sans-serif">'+u+'</text>';
        hg += '<text x="'+(x+7)+'" y="'+(y+54)+'" font-size="8.5" font-weight="800" fill="#8B97A5" font-family="Calibri,sans-serif">'+sp.label+'</text>';
        hg += '</g>';
        el += hg;
        continue;
      }
      const st = seatDay(day, sp.id);
      const bAm = st.full||st.am, bPm = st.full||st.pm;
      const sAm = sp.blocked ? "other" : (bAm ? (canManage(bAm)?"mine":"other") : "free");
      const sPm = sp.blocked ? "other" : (bPm ? (canManage(bPm)?"mine":"other") : "free");
      const anyMine = sAm==="mine"||sPm==="mine";
      const fullyOthers = bAm && bPm && !anyMine;
      const dim = opts.parkOnly ? ' opacity="0.12"' : ((!opts.admin && attrFilter==="jan" && !sp.jan) ? ' opacity="0.25"' : '');
      const clickable = (opts.admin ? click : ((sp.blocked||fullyOthers||opts.parkOnly) ? '' : ' onclick="openBookModal(\''+sp.id+'\')" style="cursor:pointer"'));
      const deskFill = s => s==="mine" ? COL.deskMine : s==="other" ? COL.deskOther : COL.deskFree;
      const isCow = cell.kind==="cow";
      const DIR_ANG = {s:0, w:90, n:180, e:270};
      const ang = DIR_ANG[sp.dir||"s"] || 0;
      let g = '<g'+clickable+dim+'>';
      /* mobília rodada conforme a orientação do lugar */
      g += '<g'+(ang?' transform="rotate('+ang+' '+(x+29)+' '+(y+29)+')"':'')+'>';
      if(sAm===sPm){
        g += '<rect x="'+(x+6)+'" y="'+(y+7)+'" width="46" height="25" rx="5" fill="'+(sp.blocked?"#EDEDF2":deskFill(sAm))+'" stroke="'+(isCow?"#7FA8E0":COL.stroke)+'" stroke-width="1.5"/>';
      } else {
        g += '<path d="M '+(x+11)+' '+(y+7)+' h 18 v 25 h -18 a 5 5 0 0 1 -5 -5 v -15 a 5 5 0 0 1 5 -5 Z" fill="'+deskFill(sAm)+'" stroke="'+COL.stroke+'" stroke-width="1.5"/>' +
             '<path d="M '+(x+29)+' '+(y+7)+' h 18 a 5 5 0 0 1 5 5 v 15 a 5 5 0 0 1 -5 5 h -18 Z" fill="'+deskFill(sPm)+'" stroke="'+COL.stroke+'" stroke-width="1.5"/>';
      }
      if(!sp.blocked){
        const monC = anyMine ? "rgba(255,255,255,.8)" : "#B9C7D6";
        g += '<rect x="'+(x+22)+'" y="'+(y+11)+'" width="14" height="9" rx="2" fill="'+monC+'"/><rect x="'+(x+27)+'" y="'+(y+20)+'" width="4" height="3" fill="'+monC+'"/>';
      }
      g += '<circle cx="'+(x+29)+'" cy="'+(y+43)+'" r="8" fill="'+(anyMine?"#5B93F0":"#D0D8E2")+'"/>' +
           '<path d="M '+(x+21)+' '+(y+43)+' a 8 8 0 0 1 16 0" fill="none" stroke="'+(anyMine?"#3D7CEB":"#B4C2D2")+'" stroke-width="2.5"/>';
      if(sp.jan) g += '<rect x="'+(x+6)+'" y="'+(y+1)+'" width="46" height="3.5" rx="1.5" fill="#9CD2F5"/>';
      g += '</g>';
      const topPill = (sp.dir==="n");         // lugar virado a norte: nome por cima
      const pillY = topPill ? y+1.5 : y+47.5; // caso contrário: nome por baixo do banco
      const labCol = (!sp.blocked && !topPill && sp.dir!=="w" && sAm==="mine") ? "rgba(255,255,255,.95)" : "#8B97A5";
      g += '<text x="'+(x+7)+'" y="'+(y+(topPill?54:15))+'" font-size="8.5" font-weight="800" fill="'+labCol+'" font-family="Calibri,sans-serif">'+sp.label+'</text>';
      if(sp.blocked){
        g += '<text x="'+(x+29)+'" y="'+(y+24)+'" font-size="13" text-anchor="middle">🔒</text>';
        if(sp.blockedBy) topLayer += namePill(x+29, pillY, dispName(sp.blockedBy, 10), "#5C6B7E", 7.2);
      } else if(st.full){
        topLayer += namePill(x+29, pillY, dispName(occupantOf(st.full), 10), anyMine?COL.mine:"#33415A", 7.4);
      } else if(bAm || bPm){
        const t = "M "+(bAm?dispName(occupantOf(bAm),6):"–")+" · T "+(bPm?dispName(occupantOf(bPm),6):"–");
        topLayer += namePill(x+29, pillY, t, "#33415A", 6.4);
      }
      const anyVis = [st.full,st.am,st.pm].some(b=>b&&b.visitor);
      const anyCk = [st.full,st.am,st.pm].some(b=>b&&b.checkedIn);
      if(anyVis) g += '<rect x="'+(x+3)+'" y="'+(y+(topPill?47:-1))+'" width="20" height="10" rx="5" fill="#3E9E70"/><text x="'+(x+13)+'" y="'+(y+(topPill?54.5:6.5))+'" font-size="6.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">VIS</text>';
      if(anyCk) g += '<circle cx="'+(x+49)+'" cy="'+(y+22)+'" r="6" fill="#3E9E70"/><text x="'+(x+49)+'" y="'+(y+25)+'" font-size="8" fill="#fff" text-anchor="middle">✓</text>';
      if(!sp.blocked) g += statusDot(x+49, topPill ? y+48 : y+9, sAm, sPm);
      if(faults[sp.id]) g += '<circle cx="'+(x+9)+'" cy="'+(y+22)+'" r="6.5" fill="#E67E22"/><text x="'+(x+9)+'" y="'+(y+25)+'" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">!</text>';
      if(opts.admin) g += '<text x="'+(x+51)+'" y="'+(y+(topPill?54:16))+'" font-size="7" font-weight="800" fill="#A5B0BF" text-anchor="end" font-family="Calibri,sans-serif">'+(isCow?"COW":"IND")+(sp.blocked?" 🔒":"")+'</text>';
      g += '</g>';
      el += g;
    }
  }

  /* ── mobília da sala de reuniões ── */
  if(roomCells.length){
    const rMin = Math.min(...roomCells.map(p=>p.r)), rMax = Math.max(...roomCells.map(p=>p.r));
    const cMin = Math.min(...roomCells.map(p=>p.c)), cMax = Math.max(...roomCells.map(p=>p.c));
    const bx = cx(cMin), by = cy(rMin);
    const bw = (cMax-cMin+1)*CS, bh = (rMax-rMin+1)*CS;
    const tw = Math.max(46, bw*0.52), th = Math.max(26, bh*0.34);
    const tx = bx + (bw-tw)/2, ty = by + (bh-th)/2 + 4;
    const usedH = Object.keys(day).filter(k=>k.startsWith(office.id+"-room:")).length;
    const anyMineH = Object.entries(day).some(([k,b])=>k.startsWith(office.id+"-room:") && canManage(b));
    let g = '<g pointer-events="none"'+(opts.parkOnly?' opacity="0.15"':'')+'>';
    /* mesa */
    g += '<rect x="'+tx+'" y="'+ty+'" width="'+tw+'" height="'+th+'" rx="'+(th/2.4)+'" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.6"/>';
    /* cadeiras em cima e em baixo */
    const nCh = Math.max(2, Math.floor(tw/26));
    for(let i=0;i<nCh;i++){
      const ccx = tx + tw*(i+0.5)/nCh;
      g += '<circle cx="'+ccx+'" cy="'+(ty-8)+'" r="5.5" fill="#D0D8E2"/>';
      g += '<circle cx="'+ccx+'" cy="'+(ty+th+8)+'" r="5.5" fill="#D0D8E2"/>';
    }
    /* nome e estado */
    g += '<text x="'+(bx+bw/2)+'" y="'+(ty+th/2-1)+'" font-size="9.5" font-weight="800" fill="#0E182B" text-anchor="middle" font-family="Calibri,sans-serif">'+esc(office.room)+'</text>';
    g += '<text x="'+(bx+bw/2)+'" y="'+(ty+th/2+10)+'" font-size="8" font-weight="700" fill="'+(usedH? (anyMineH?"#1F6FEB":"#8B97A5") : "#3E9E70")+'" text-anchor="middle" font-family="Calibri,sans-serif">'+
      (usedH ? usedH+"/"+HOURS.length+" horas ocupadas" : "livre · 09h–18h")+'</text>';
    if(!opts.admin) g += '<text x="'+(bx+bw/2)+'" y="'+(by+bh-6)+'" font-size="7" font-weight="700" fill="#A5B0BF" text-anchor="middle" font-family="Calibri,sans-serif">tocar para ver o horário</text>';
    g += '</g>';
    el += g;
  }

  /* ── paredes, portas e janelas (arestas) ── */
  const walls = office.walls || {};
  const TH = 6, JW = CS*0.2, RO = CS*0.62;
  Object.keys(walls).forEach(k=>{
    const v = walls[k];
    const [or_, rc] = k.split(":");
    const [r, c] = rc.split(",").map(Number);
    if(or_==="h"){
      const x = cx(c), y = cy(r);
      if(v===1){
        el += '<rect x="'+(x-TH/2)+'" y="'+(y-TH/2)+'" width="'+(CS+TH)+'" height="'+TH+'" rx="2" fill="'+COL.wall+'"/>';
      } else if(v===2){
        el += '<rect x="'+(x-TH/2)+'" y="'+(y-TH/2)+'" width="'+(JW+TH/2)+'" height="'+TH+'" rx="2" fill="'+COL.wall+'"/>' +
              '<rect x="'+(x+CS-JW)+'" y="'+(y-TH/2)+'" width="'+(JW+TH/2)+'" height="'+TH+'" rx="2" fill="'+COL.wall+'"/>' +
              '<line x1="'+(x+JW)+'" y1="'+y+'" x2="'+(x+JW)+'" y2="'+(y+RO)+'" stroke="'+COL.wall+'" stroke-width="2"/>' +
              '<path d="M '+(x+JW+RO)+' '+y+' A '+RO+' '+RO+' 0 0 1 '+(x+JW)+' '+(y+RO)+'" fill="none" stroke="#A5B0BF" stroke-width="1.2" stroke-dasharray="3 2.5"/>';
      } else if(v===3){
        el += '<rect x="'+(x-1)+'" y="'+(y-3)+'" width="'+(CS+2)+'" height="6" fill="#D8ECFA" stroke="#7FB5E8" stroke-width="1"/>' +
              '<line x1="'+x+'" y1="'+y+'" x2="'+(x+CS)+'" y2="'+y+'" stroke="#7FB5E8" stroke-width="1.2"/>';
      } else if(v===4){
        el += '<rect x="'+(x+1)+'" y="'+(y-6)+'" width="'+(CS-2)+'" height="12" rx="2" fill="#EADBC0" stroke="#C7B08A" stroke-width="1.2"/>' +
              '<line x1="'+(x+CS/3)+'" y1="'+(y-6)+'" x2="'+(x+CS/3)+'" y2="'+(y+6)+'" stroke="#C7B08A" stroke-width="1"/>' +
              '<line x1="'+(x+2*CS/3)+'" y1="'+(y-6)+'" x2="'+(x+2*CS/3)+'" y2="'+(y+6)+'" stroke="#C7B08A" stroke-width="1"/>' +
              '<circle cx="'+(x+CS/6)+'" cy="'+y+'" r="1.3" fill="#8A6F45"/><circle cx="'+(x+CS/2)+'" cy="'+y+'" r="1.3" fill="#8A6F45"/><circle cx="'+(x+5*CS/6)+'" cy="'+y+'" r="1.3" fill="#8A6F45"/>';
      }
    } else {
      const x = cx(c), y = cy(r);
      if(v===1){
        el += '<rect x="'+(x-TH/2)+'" y="'+(y-TH/2)+'" width="'+TH+'" height="'+(CS+TH)+'" rx="2" fill="'+COL.wall+'"/>';
      } else if(v===2){
        el += '<rect x="'+(x-TH/2)+'" y="'+(y-TH/2)+'" width="'+TH+'" height="'+(JW+TH/2)+'" rx="2" fill="'+COL.wall+'"/>' +
              '<rect x="'+(x-TH/2)+'" y="'+(y+CS-JW)+'" width="'+TH+'" height="'+(JW+TH/2)+'" rx="2" fill="'+COL.wall+'"/>' +
              '<line x1="'+x+'" y1="'+(y+JW)+'" x2="'+(x+RO)+'" y2="'+(y+JW)+'" stroke="'+COL.wall+'" stroke-width="2"/>' +
              '<path d="M '+x+' '+(y+JW+RO)+' A '+RO+' '+RO+' 0 0 1 '+(x+RO)+' '+(y+JW)+'" fill="none" stroke="#A5B0BF" stroke-width="1.2" stroke-dasharray="3 2.5"/>';
      } else if(v===3){
        el += '<rect x="'+(x-3)+'" y="'+(y-1)+'" width="6" height="'+(CS+2)+'" fill="#D8ECFA" stroke="#7FB5E8" stroke-width="1"/>' +
              '<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+CS)+'" stroke="#7FB5E8" stroke-width="1.2"/>';
      } else if(v===4){
        el += '<rect x="'+(x-6)+'" y="'+(y+1)+'" width="12" height="'+(CS-2)+'" rx="2" fill="#EADBC0" stroke="#C7B08A" stroke-width="1.2"/>' +
              '<line x1="'+(x-6)+'" y1="'+(y+CS/3)+'" x2="'+(x+6)+'" y2="'+(y+CS/3)+'" stroke="#C7B08A" stroke-width="1"/>' +
              '<line x1="'+(x-6)+'" y1="'+(y+2*CS/3)+'" x2="'+(x+6)+'" y2="'+(y+2*CS/3)+'" stroke="#C7B08A" stroke-width="1"/>' +
              '<circle cx="'+x+'" cy="'+(y+CS/6)+'" r="1.3" fill="#8A6F45"/><circle cx="'+x+'" cy="'+(y+CS/2)+'" r="1.3" fill="#8A6F45"/><circle cx="'+x+'" cy="'+(y+5*CS/6)+'" r="1.3" fill="#8A6F45"/>';
      }
    }
  });

  /* ── paredes diagonais ── */
  Object.keys(office.diags||{}).forEach(k=>{
    const [r,c] = k.split(",").map(Number);
    const x = cx(c), y = cy(r);
    const v = office.diags[k];
    let x1,y1,x2,y2;
    if(v===1){ x1=x; y1=y; x2=x+CS; y2=y+CS; }               // ╲ 1×1
    else if(v===2){ x1=x+CS; y1=y; x2=x; y2=y+CS; }          // ╱ 1×1
    else if(v===3){ x1=x; y1=y; x2=x+2*CS; y2=y+CS; }        // ╲ 2 células na horizontal
    else if(v===4){ x1=x+2*CS; y1=y; x2=x; y2=y+CS; }        // ╱ 2 células na horizontal
    else if(v===5){ x1=x; y1=y; x2=x+CS; y2=y+2*CS; }        // ╲ 2 células na vertical
    else { x1=x+CS; y1=y; x2=x; y2=y+2*CS; }                 // ╱ 2 células na vertical
    el += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+COL.wall+'" stroke-width="6" stroke-linecap="round"/>';
  });

  /* ── editor: guias e zonas de clique das arestas ── */
  if(opts.admin && (WALL_TOOLS[admTool] || admTool==="erase")){
    /* pontos de grelha */
    for(let r=0; r<=office.rows; r++)
      for(let c=0; c<=office.cols; c++)
        el += '<circle cx="'+cx(c)+'" cy="'+cy(r)+'" r="1.8" fill="#CBD5E0"/>';
    /* zonas de clique */
    for(let r=0; r<=office.rows; r++)
      for(let c=0; c<office.cols; c++)
        el += '<rect x="'+(cx(c)+3)+'" y="'+(cy(r)-6)+'" width="'+(CS-6)+'" height="12" fill="rgba(0,0,0,0)"'+paintAttrs("admEdge('h',"+r+","+c+")")+'/>';
    for(let r=0; r<office.rows; r++)
      for(let c=0; c<=office.cols; c++)
        el += '<rect x="'+(cx(c)-6)+'" y="'+(cy(r)+3)+'" width="12" height="'+(CS-6)+'" fill="rgba(0,0,0,0)"'+paintAttrs("admEdge('v',"+r+","+c+")")+'/>';
  }

  /* nomes e legendas — sempre visíveis, por cima das paredes */
  if(topLayer) el += '<g pointer-events="none">'+topLayer+'</g>';

  /* ── editor: seleção de zona ── */
  if(opts.admin && admZone){
    const a = admZone.a, b = admZone.b || admZone.a;
    const r0 = Math.min(a[0],b[0]), r1 = Math.max(a[0],b[0]);
    const c0 = Math.min(a[1],b[1]), c1 = Math.max(a[1],b[1]);
    el += '<rect x="'+cx(c0)+'" y="'+cy(r0)+'" width="'+((c1-c0+1)*CS)+'" height="'+((r1-r0+1)*CS)+'" fill="rgba(31,111,235,.10)" stroke="#1F6FEB" stroke-width="2" stroke-dasharray="6 4" pointer-events="none"/>';
  }

  /* ── editor: eliminar (×) e inserir (+) linhas/colunas diretamente ── */
  if(opts.admin){
    const gy = PAD + GUT/2, gx = PAD + GUT/2;
    for(let c=0; c<office.cols; c++){
      const X = cx(c)+CS/2;
      el += '<g onclick="admShift(\'c\','+c+',-1)" style="cursor:pointer">' +
        '<circle cx="'+X+'" cy="'+gy+'" r="7.5" fill="#FAECEA" stroke="#F2D2CD" stroke-width="1.2"/>' +
        '<text x="'+X+'" y="'+(gy+3.5)+'" font-size="11" font-weight="800" fill="#C0392B" text-anchor="middle" font-family="Calibri,sans-serif">×</text></g>';
    }
    for(let c=0; c<=office.cols; c++){
      const X = cx(c);
      el += '<g onclick="admShift(\'c\','+c+',1)" style="cursor:pointer">' +
        '<circle cx="'+X+'" cy="'+gy+'" r="5.5" fill="#E8F0FE" stroke="#B9D2F5" stroke-width="1.2"/>' +
        '<text x="'+X+'" y="'+(gy+3)+'" font-size="9" font-weight="800" fill="#1F6FEB" text-anchor="middle" font-family="Calibri,sans-serif">+</text></g>';
    }
    for(let r=0; r<office.rows; r++){
      const Y = cy(r)+CS/2;
      el += '<g onclick="admShift(\'r\','+r+',-1)" style="cursor:pointer">' +
        '<circle cx="'+gx+'" cy="'+Y+'" r="7.5" fill="#FAECEA" stroke="#F2D2CD" stroke-width="1.2"/>' +
        '<text x="'+gx+'" y="'+(Y+3.5)+'" font-size="11" font-weight="800" fill="#C0392B" text-anchor="middle" font-family="Calibri,sans-serif">×</text></g>';
    }
    for(let r=0; r<=office.rows; r++){
      const Y = cy(r);
      el += '<g onclick="admShift(\'r\','+r+',1)" style="cursor:pointer">' +
        '<circle cx="'+gx+'" cy="'+Y+'" r="5.5" fill="#E8F0FE" stroke="#B9D2F5" stroke-width="1.2"/>' +
        '<text x="'+gx+'" y="'+(Y+3)+'" font-size="9" font-weight="800" fill="#1F6FEB" text-anchor="middle" font-family="Calibri,sans-serif">+</text></g>';
    }
  }

  const zoomCtl = '<div class="zoom-ctl">' +
    (opts.admin ? '<button class="undo-btn" onclick="admUndo()" title="Anular">↶ Anular</button>' : '') +
    '<button onclick="setZoom(-0.15)">−</button><span>'+Math.round(mapZoom*100)+'%</span><button onclick="setZoom(0.15)">+</button>' +
    '</div>';
  return '<div class="map-wrap">'+zoomCtl+
    '<div class="map-scroll"><div style="width:calc(min(100%, '+W+'px) * '+mapZoom+'); margin:0 auto">' +
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block; background:#FBFAF7; border-radius:12px; user-select:none" xmlns="http://www.w3.org/2000/svg">'+el+'</svg>' +
    '</div></div></div>';
}

/* ─── Parque de estacionamento dedicado ─── */
function parkingLotHtml(office, popts){
  popts = popts || {};
  const {parks} = derive(office);
  const day = bookings[dateSel] || {};
  const n = Math.max(1, parks.length);
  const BW = 150, BH = 190, GAP = 20, PADX = 46, PADT = 74, PADB = 34;
  const W = Math.max(340, PADX*2 + n*BW + (n-1)*GAP);
  const H = PADT + BH + PADB;
  let el = "";
  /* asfalto */
  el += '<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="16" fill="#474D63"/>';
  /* faixa de circulação com seta de entrada */
  el += '<line x1="18" y1="44" x2="'+(W-18)+'" y2="44" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-dasharray="14 10"/>';
  el += '<path d="M '+(W-58)+' 30 h 22 l -7 -7 m 7 7 l -7 7" stroke="rgba(255,255,255,.75)" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
  el += '<text x="'+(W-64)+'" y="34" font-size="10" font-weight="700" fill="rgba(255,255,255,.75)" text-anchor="end" font-family="Calibri,sans-serif">'+t("entry")+'</text>';
  /* sinal P */
  el += '<circle cx="34" cy="28" r="15" fill="#1F6FEB" stroke="#fff" stroke-width="2.5"/>' +
        '<text x="34" y="34.5" font-size="18" font-weight="800" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">P</text>';
  /* nome do escritório */
  el += '<text x="'+(W/2)+'" y="'+(H-12)+'" font-size="10.5" font-weight="700" fill="rgba(255,255,255,.55)" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="1.5">ESTACIONAMENTO · '+esc(office.name.toUpperCase())+'</text>';

  parks.forEach((p, i)=>{
    const x = PADX + i*(BW+GAP), y = PADT;
    const b = day[p.id];
    const mine = b && canManage(b);
    const canClick = !popts.static && !p.blocked && (!b || mine);
    let g = '<g'+(canClick?' onclick="openBookModal(\''+p.id+'\')" style="cursor:pointer"':'')+'>';
    /* baia */
    g += '<rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="10" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.85)" stroke-width="3"/>';
    g += '<text x="'+(x+12)+'" y="'+(y+24)+'" font-size="16" font-weight="800" fill="rgba(255,255,255,.9)" font-family="Calibri,sans-serif">'+p.label+'</text>';
    if(faults[p.id]) g += '<circle cx="'+(x+BW-16)+'" cy="'+(y+18)+'" r="8" fill="#E67E22"/><text x="'+(x+BW-16)+'" y="'+(y+21.5)+'" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">!</text>';
    if(p.blocked){
      g += '<text x="'+(x+BW/2)+'" y="'+(y+BH/2-2)+'" font-size="30" text-anchor="middle">🔒</text>';
      if(p.blockedBy){
        g += '<text x="'+(x+BW/2)+'" y="'+(y+BH/2+30)+'" font-size="12" font-weight="800" fill="rgba(255,255,255,.9)" text-anchor="middle" font-family="Calibri,sans-serif">'+esc(p.blockedBy)+'</text>' +
             '<text x="'+(x+BW/2)+'" y="'+(y+BH/2+46)+'" font-size="8.5" font-weight="700" fill="rgba(255,255,255,.5)" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="1">'+t("fixed")+'</text>';
      }
    } else if(b){
      const carC = mine ? "#1F6FEB" : "#B4BCD0";
      const cw = BW*0.6, ch = BH*0.66, cx0 = x+(BW-cw)/2, cy0 = y+34;
      g += '<rect x="'+(cx0-6)+'" y="'+(cy0+14)+'" width="6" height="16" rx="3" fill="#22273A"/><rect x="'+(cx0+cw)+'" y="'+(cy0+14)+'" width="6" height="16" rx="3" fill="#22273A"/>' +
           '<rect x="'+(cx0-6)+'" y="'+(cy0+ch-32)+'" width="6" height="16" rx="3" fill="#22273A"/><rect x="'+(cx0+cw)+'" y="'+(cy0+ch-32)+'" width="6" height="16" rx="3" fill="#22273A"/>';
      g += '<rect x="'+cx0+'" y="'+cy0+'" width="'+cw+'" height="'+ch+'" rx="20" fill="'+carC+'"/>';
      g += '<rect x="'+(cx0+10)+'" y="'+(cy0+16)+'" width="'+(cw-20)+'" height="20" rx="7" fill="rgba(255,255,255,.7)"/>';
      g += '<rect x="'+(cx0+10)+'" y="'+(cy0+ch-32)+'" width="'+(cw-20)+'" height="16" rx="6" fill="rgba(255,255,255,.45)"/>';
      g += '<text x="'+(cx0+cw/2)+'" y="'+(cy0+ch/2+2)+'" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">'+esc(firstName(occupantOf(b)))+'</text>';
      const plate = !b.visitor && profiles[b.name] && profiles[b.name].plate;
      if(plate) g += '<rect x="'+(cx0+cw/2-26)+'" y="'+(cy0+ch/2+9)+'" width="52" height="13" rx="3" fill="#fff" stroke="#94A3B8"/><text x="'+(cx0+cw/2)+'" y="'+(cy0+ch/2+18.5)+'" font-size="8.5" font-weight="800" fill="#1E293B" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="1">'+esc(plate.toUpperCase())+'</text>';
      if(b.visitor) g += '<rect x="'+(x+BW-46)+'" y="'+(y+10)+'" width="34" height="16" rx="8" fill="#3E9E70"/><text x="'+(x+BW-29)+'" y="'+(y+21.5)+'" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" font-family="Calibri,sans-serif">VIS</text>';
      if(b.checkedIn) g += '<circle cx="'+(x+BW-18)+'" cy="'+(y+BH-18)+'" r="10" fill="#3E9E70"/><text x="'+(x+BW-18)+'" y="'+(y+BH-13.5)+'" font-size="12" fill="#fff" text-anchor="middle">✓</text>';
      if(mine) g += '<text x="'+(x+BW/2)+'" y="'+(y+BH-8)+'" font-size="8.5" font-weight="700" fill="rgba(255,255,255,.7)" text-anchor="middle" font-family="Calibri,sans-serif">'+t("tap_manage")+'</text>';
    } else {
      g += '<circle cx="'+(x+BW/2)+'" cy="'+(y+BH/2-14)+'" r="13" fill="#3E9E70" stroke="#fff" stroke-width="2.5"/>';
      g += '<text x="'+(x+BW/2)+'" y="'+(y+BH/2+22)+'" font-size="13" font-weight="800" fill="#7FE0B0" text-anchor="middle" font-family="Calibri,sans-serif" letter-spacing="2">'+t("free_big")+'</text>';
      g += '<text x="'+(x+BW/2)+'" y="'+(y+BH/2+40)+'" font-size="8.5" font-weight="700" fill="rgba(255,255,255,.55)" text-anchor="middle" font-family="Calibri,sans-serif">'+t("tap_book")+'</text>';
    }
    g += '</g>';
    el += g;
  });

  return '<div class="map-wrap" style="padding:14px 14px 14px"><div style="max-width:'+W+'px; margin:0 auto">' +
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">'+el+'</svg></div></div>';
}

/* ═══ Reservar ═══ */
function renderBook(app){
  const office = getOffice(officeId);
  const {seats, parks} = derive(office);
  const days = getDays();
  if(!days.some(d=>d.iso===dateSel)) dateSel = days[0].iso;
  const day = bookings[dateSel] || {};

  const presentNames = [];
  Object.entries(day).forEach(([k,v])=>{
    if(!k.startsWith(officeId+"-seat-")) return;
    const nm = v.visitor ? v.visitor+" (visitante)" : v.name;
    const half = periodOf(k)==="am" ? " (manhã)" : periodOf(k)==="pm" ? " (tarde)" : "";
    presentNames.push(nm+half);
  });
  const present = [...new Set(presentNames)].sort();

  const myCount = Object.values(day).filter(v=>canManage(v)).length;
  const seatFree = seats.filter(s=>{ if(s.blocked) return false; const st=seatDay(day,s.id); return !(st.full||(st.am&&st.pm)); }).length;
  const parkFree = parks.filter(p=>!p.blocked && !day[p.id]).length;

  const mySeatKey = Object.keys(day).find(k=>isSeatKey(k) && day[k].name===user && !day[k].visitor);
  const mySeatOffice = mySeatKey ? (officeOfSpot(baseId(mySeatKey))||{}).name : null;

  const td = config.teamDays[dateSel];

  let html = headerHtml(true) + '<main>';

  html += daysStripHtml(days, d=>{
    const cnt = Object.keys(bookings[d.iso]||{}).filter(k=>k.startsWith(officeId+"-seat-")).length;
    return cnt>0 ? '<div class="cnt">'+cnt+' '+t("pres")+'</div>' : '';
  });

  if(!SYNC_URL && !SB){
    html += '<div class="sync-note">Modo local: as reservas ficam guardadas apenas neste dispositivo. Para partilhar com a equipa, configura o SYNC_URL no ficheiro.</div>';
  }
  if(td){
    const tdo = getOffice(td.officeId);
    html += '<div class="teamday">⭐ '+esc(td.label||"Dia de equipa")+(tdo?' · escritório '+esc(tdo.name):'')+'</div>';
  }
  ((config.notices||{})[officeId]||[]).forEach(n=>{
    html += '<div class="notice">📌 '+esc(n.text)+'</div>';
  });

  html += '<div class="stats">' +
    '<div class="stat"><div class="n">'+seatFree+'<span class="of">/'+seats.length+'</span></div><div class="l">'+t("free_seats")+'</div></div>' +
    '<div class="stat"><div class="n">'+parkFree+'<span class="of">/'+parks.length+'</span></div><div class="l">'+t("free_park")+'</div></div>' +
    '<div class="stat"><div class="n '+(myCount>0?"mine":"")+'">'+myCount+'</div><div class="l">'+t("my_bkgs")+'</div></div>' +
    '</div>';

  /* sugestão: favoritos presentes noutro escritório e ainda sem reserva minha */
  const myAnySeat = Object.entries(day).some(([k,v])=>isSeatKey(k) && v.name===user && !v.visitor);
  if(!myAnySeat && favs.length){
    const favWhere = {};
    Object.entries(day).forEach(([k,v])=>{
      if(!isSeatKey(k) || v.visitor) return;
      if(favs.includes(v.name)){
        const fo = officeOfSpot(baseId(k));
        if(fo) (favWhere[fo.id] = favWhere[fo.id]||[]).push(firstName(v.name));
      }
    });
    const oids = Object.keys(favWhere);
    if(oids.length){
      const bestOid = oids.sort((a,b)=>favWhere[b].length-favWhere[a].length)[0];
      const fo = getOffice(bestOid);
      const names = [...new Set(favWhere[bestOid])].slice(0,3).join(", ");
      html += '<div class="teamday" style="background:#EAF1FC; border-color:#B9D2F5; color:#1F6FEB; cursor:pointer" onclick="setOffice(\''+bestOid+'\')">' +
        '⭐ '+esc(names)+' estará'+(favWhere[bestOid].length>1?'ão':'')+' em '+esc(fo.name)+' neste dia'+(bestOid!==officeId?' — tocar para ver lugares':'')+'</div>';
    }
  }
  /* padrão de presenças: costuma vir a um dia da semana */
  (function(){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
    const cutIso = cutoff.toISOString().slice(0,10);
    const dowCount = {};
    Object.keys(bookings).forEach(iso=>{
      if(iso < cutIso || iso > TODAY) return;
      const hasMine = Object.entries(bookings[iso]).some(([k,v])=>isSeatKey(k) && v.name===user && !v.visitor);
      if(hasMine){
        const dw = new Date(iso+"T00:00:00Z").getUTCDay();
        dowCount[dw] = (dowCount[dw]||0)+1;
      }
    });
    const best = Object.keys(dowCount).sort((a,b)=>dowCount[b]-dowCount[a])[0];
    if(!best || dowCount[best] < 3) return;
    const targets = days.filter(d=>{
      if(new Date(d.iso+"T00:00:00Z").getUTCDay() !== +best) return false;
      const dd = bookings[d.iso] || {};
      return !Object.entries(dd).some(([k,v])=>isSeatKey(k) && v.name===user && !v.visitor);
    }).slice(0,4);
    if(targets.length < 2) return;
    const dowName = DIAS_LONG[+best].toLowerCase()+"s";
    html += '<div class="teamday" style="background:#EEF0FA; border-color:#C9D2F2; color:#3B5BFF; cursor:pointer" ' +
      'onclick="bookPattern(\''+targets.map(t=>t.iso).join(",")+'\')">' +
      '📈 Costumas vir às '+dowName+' — tocar para reservar as próximas '+targets.length+'</div>';
  })();
  if(habitualValid()){
    const hk = habitualKey();
    const hb = day[hk];
    const mineH = hb && canManage(hb);
    const occH = hb && !mineH;
    html += '<button class="habitual '+(mineH?"done":occH?"occ":"")+'" onclick="bookHabitual()"'+(occH?' disabled':'')+'>' +
      (mineH ? t("hab_done")
       : occH ? t("hab_occ")+esc(firstName(occupantOf(hb)))
       : t("hab_book")+esc(describeSpot(hk))) + '</button>';
    const qts = quickTargets();
    if(qts.length){
      html += '<div class="quick-card"><div class="qt">'+t("quick_t")+' · <b>★ '+esc(describeSpot(hk))+'</b></div>' +
        '<div class="quick-days">' +
        qts.map(d=>'<button onclick="quickBook(\''+d.iso+'\')">'+quickLabel(d)+'</button>').join("") +
        '</div></div>';
    }
  }
  if(mySeatKey && mySeatOffice !== office.name){
    html += '<div class="warn">Já tens lugar reservado neste dia no escritório <b>'+esc(mySeatOffice)+'</b>.</div>';
  }

  html += '<div class="tabs">' +
    '<button class="'+(tab==="map"?"active":"")+'" onclick="setTab(\'map\')">'+t("tab_map")+'</button>' +
    '<button class="'+(tab==="week"?"active":"")+'" onclick="setTab(\'week\')">'+t("tab_week")+'</button>' +
    '<button class="'+(tab==="month"?"active":"")+'" onclick="setTab(\'month\')">'+t("tab_month")+'</button>' +
    '<button class="'+(tab==="park"?"active":"")+'" onclick="setTab(\'park\')">'+t("tab_park")+'</button>' +
    '<button class="'+(tab==="room"?"active":"")+'" onclick="setTab(\'room\')">'+t("tab_room")+'</button>' +
    '<button class="'+(tab==="remote"?"active":"")+'" onclick="setTab(\'remote\')">Remoto</button>' +
    '</div>';

  /* ─── Mês: calendário mensal com reserva rápida ─── */
  if(tab==="month"){
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+monthOff);
    const y = base.getFullYear(), mo = base.getMonth();
    const MESES_LONG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const bookable = new Set(days.map(d=>d.iso));
    html += '<div class="month-head">' +
      '<button class="btn-sm" '+(monthOff<=0?'disabled style="opacity:.4"':'onclick="setMonthOff(-1)"')+'>◀</button>' +
      '<span>'+MESES_LONG[mo]+' '+y+'</span>' +
      '<button class="btn-sm" '+(monthOff>=2?'disabled style="opacity:.4"':'onclick="setMonthOff(1)"')+'>▶</button></div>';
    html += '<div class="month-grid month-hdr">'+["Seg","Ter","Qua","Qui","Sex"].map(d=>'<div>'+d+'</div>').join("")+'</div>';
    const last = new Date(y, mo+1, 0).getDate();
    let cells = "";
    const firstDow = new Date(y, mo, 1).getDay();          // 0=Dom
    let col = firstDow===0 ? 5 : firstDow===6 ? 5 : firstDow-1; // posição do dia 1 (Sáb/Dom → semana seguinte)
    if(firstDow>=1 && firstDow<=5) for(let i=0;i<firstDow-1;i++) cells += '<div class="mday off"></div>';
    for(let dnum=1; dnum<=last; dnum++){
      const dt = new Date(Date.UTC(y, mo, dnum));
      const dow = dt.getUTCDay();
      if(dow===0 || dow===6) continue;
      const iso = dt.toISOString().slice(0,10);
      const hol = isHoliday(iso);
      const past = iso < TODAY;
      const mDay = bookings[iso] || {};
      const myKey = Object.keys(mDay).find(k=>isSeatKey(k) && mDay[k].name===user && !mDay[k].visitor);
      const cnt = Object.keys(mDay).filter(k=>isSeatKey(k)).length;
      const tdM = config.teamDays[iso];
      const canAct = !past && !hol && (myKey || bookable.has(iso));
      let cls = "mday";
      if(past||hol) cls += " off";
      if(myKey) cls += " mine";
      if(iso===TODAY) cls += " today";
      cells += '<div class="'+cls+'"'+(canAct?' onclick="monthTap(\''+iso+'\')"':'')+'>' +
        '<div class="md-top"><span class="md-n">'+dnum+'</span>'+(tdM?'<span>⭐</span>':'')+(hol?'<span class="md-f">F</span>':'')+'</div>' +
        (myKey ? '<div class="md-b">✓ '+esc(baseId(myKey).split("-seat-")[1])+'</div>'
         : cnt ? '<div class="md-c">'+cnt+' pres.</div>' : '') +
        '</div>';
    }
    html += '<div class="month-grid">'+cells+'</div>';
    html += '<div class="hint" style="margin-top:10px">Toca num dia para reservar '+(habitualValid()?'o teu lugar habitual':'um lugar')+' ou cancelar · F = feriado · dias fora do período de '+config.rules.maxAdvanceDays+' dias úteis não são reserváveis</div>';
  }

  if(tab==="remote"){
    html += '<div class="adm-note" style="margin:0 0 10px">Marca os dias em que estás em teletrabalho — visível para a equipa. Um toque marca, outro desmarca.</div>';
    days.forEach(d=>{
      const on = isRemote(d.iso);
      const cnt = Object.keys(remoteDays[d.iso]||{}).length;
      html += '<div class="mybk-item"><div class="info">' +
        '<div class="t">'+d.dow+', '+d.num+' '+d.mes+(d.iso===TODAY?' · hoje':'')+'</div>' +
        '<div class="s">'+(on?'<span style="color:#1F6FEB; font-weight:700">🏠 em teletrabalho</span>':'<span style="color:#8B97A5">sem marcação</span>')+(cnt?' · '+cnt+' em remoto':'')+'</div>' +
        '</div><div class="mybk-actions">'+(on?'<button class="btn-sm danger" onclick="toggleRemote(\''+d.iso+'\')">Desmarcar</button>':'<button class="btn-sm ok" onclick="toggleRemote(\''+d.iso+'\')">Marcar</button>')+'</div></div>';
    });
  }

  if(tab==="week"){
    html += '<div class="adm-note" style="margin:0 0 10px">Planeia a semana num ecrã: um toque reserva '+(habitualValid()?'o teu lugar habitual':'o primeiro lugar livre de '+esc(office.name))+', outro cancela.</div>';
    days.forEach(d=>{
      const wDay = bookings[d.iso] || {};
      const myKey = Object.keys(wDay).find(k=>isSeatKey(k) && wDay[k].name===user && !wDay[k].visitor);
      const cnt = Object.keys(wDay).filter(k=>isSeatKey(k)).length;
      const tdW = config.teamDays[d.iso];
      let status, action;
      if(myKey){
        const wo = officeOfSpot(baseId(myKey));
        status = '<span style="color:#1F6FEB; font-weight:700">✓ '+esc(describeSpot(myKey).replace(" · "+(wo?wo.name:""), ""))+' · '+esc(wo?wo.name:"")+'</span>';
        action = '<button class="btn-sm danger" onclick="cancelSpot(\''+myKey+'\', \''+d.iso+'\')">Cancelar</button>';
      } else {
        status = '<span style="color:#8B97A5">sem reserva</span>';
        action = '<button class="btn-sm ok" onclick="weekBook(\''+d.iso+'\')">Reservar</button>';
      }
      html += '<div class="mybk-item"><div class="info">' +
        '<div class="t">'+(tdW?'⭐ ':'')+d.dow+', '+d.num+' '+d.mes+(d.iso===TODAY?' · hoje':'')+'</div>' +
        '<div class="s">'+status+(cnt?' · '+cnt+' presença'+(cnt>1?'s':'')+'':'')+'</div>' +
        '</div><div class="mybk-actions">'+action+'</div></div>';
    });
  }

  if(tab==="map"){
    const hasJan = seats.some(s=>s.jan) && seats.some(s=>!s.jan);
    if(hasJan){
      html += '<div class="filters"><button class="'+(attrFilter==="all"?"active":"")+'" onclick="setAttrFilter(\'all\')">Todos</button>' +

    '</div>';

  const dayRides = rides[dateSel] || [];
  html += '<div class="adm-card"><h4>🚘 Boleias · '+fmtDate(dateSel)+'</h4>' +
    (dayRides.length ? dayRides.map(r=>{
      const freeS = r.seats - r.riders.length;
      const isDriver = r.driver===user;
      const isRider = r.riders.includes(user);
      let action;
      if(isDriver) action = '<button class="btn-sm danger" onclick="rideDel(\''+r.id+'\')">Cancelar</button>';
      else if(isRider) action = '<button class="btn-sm danger" onclick="rideLeave(\''+r.id+'\')">Sair</button>';
      else if(freeS>0) action = '<button class="btn-sm ok" onclick="rideJoin(\''+r.id+'\')">Apanhar boleia</button>';
      else action = '<span style="font-size:11px; color:#C0392B; font-weight:700">cheia</span>';

    }).join("") : '<div class="adm-note" style="margin:0 0 8px">Ainda ninguém ofereceu boleia neste dia.</div>') +

  html += '</main>';
  app.innerHTML = html;
}

function openRideModal(){ modalState = {kind:"ride", from:officeId, to:"", time:"08:45", seats:3}; renderModal(); }
function rideSet(f, v){ modalState[f] = v; const t=document.getElementById("rdTime"); if(t) modalState.time=t.value; renderModal(); }
function rideConfirm(){
  const m = modalState;
  const t = document.getElementById("rdTime");
  if(t) m.time = t.value.trim() || "08:45";
  if(!m.to || m.to===m.from){ showToast("Escolhe origem e destino diferentes"); return; }
  (rides[dateSel] = rides[dateSel] || []).push({
    id: Date.now()+"", driver:user, from:m.from, to:m.to, time:m.time, seats:m.seats, riders:[]
  });
  saveAll(); closeModal(); render();
  showToast("🚘 Boleia publicada — obrigado!");
}
function rideJoin(id){
  const r = (rides[dateSel]||[]).find(x=>x.id===id);
  if(!r || r.riders.includes(user) || r.riders.length>=r.seats) return;
  r.riders.push(user);
  saveAll(); render();
  const ph = profiles[r.driver] && profiles[r.driver].phone;
  showToast("Boleia confirmada com "+firstName(r.driver)+(ph?" · "+ph:""));
}
function rideLeave(id){
  const r = (rides[dateSel]||[]).find(x=>x.id===id);
  if(!r) return;
  r.riders = r.riders.filter(n=>n!==user);
  saveAll(); render();
}
function rideDel(id){
  rides[dateSel] = (rides[dateSel]||[]).filter(x=>x.id!==id);
  saveAll(); render();
}

let mineTab = "res";

function pfPhotoUpload(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement("canvas");
      const S = 96;
      cv.width = S; cv.height = S;
      const g = cv.getContext("2d");
      const m = Math.min(img.width, img.height);
      g.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      const p = profiles[user] || {};
      p.photo = cv.toDataURL("image/jpeg", 0.85);
      profiles[user] = p;
      saveAll(); renderNav(); render();
      showToast("📷 Fotografia atualizada");
    };
    img.onerror = ()=>showToast("Imagem inválida");
    img.src = e.target.result;
  };
  r.readAsDataURL(f);
  ev.target.value = "";
}
function pfPhotoDel(){
  const p = profiles[user];
  if(p && p.photo){ delete p.photo; saveAll(); renderNav(); render(); showToast("Fotografia removida"); }
}
function avatarHtml(name, cls){

}

function renderTeamList(){
  const el = document.getElementById("teamList");
  if(!el) return;
  const days = getDays();
  const people = {};
  days.forEach(d=>{
    const day = bookings[d.iso] || {};
    Object.entries(day).forEach(([key, b])=>{
      if(!isSeatKey(key) || b.visitor) return;
      const o = officeOfSpot(baseId(key));
      const p = periodOf(key);
      const tag = p==="am" ? " (M)" : p==="pm" ? " (T)" : "";
      (people[b.name] = people[b.name] || []).push({iso:d.iso, dow:d.dow, num:d.num, office:(o?o.name:"")+tag});
    });
  });
  days.forEach(d=>{
    Object.keys(remoteDays[d.iso]||{}).forEach(n=>{
      (people[n] = people[n] || []).push({iso:d.iso, dow:d.dow, num:d.num, office:"Teletrabalho", remote:true});
    });
  });
  const q = teamQuery.trim().toLowerCase();
  let names = Object.keys(people).filter(n=>!q || n.toLowerCase().includes(q));
  names.sort((a,b)=>{
    const fa = favs.includes(a)?0:1, fb = favs.includes(b)?0:1;
    return fa-fb || a.localeCompare(b);
  });
  if(!names.length){
    el.innerHTML = '<div class="empty-box">'+(q?"Sem resultados para «"+esc(teamQuery)+"».":"Ainda ninguém reservou lugar nos próximos dias.")+'</div>';
    return;
  }
  el.innerHTML = names.map(n=>{
    const isFav = favs.includes(n);

/* ═══ Ocupação / Analytics ═══ */
function occBars(daysArr, oid, total){
  let sum = 0;
  const cols = daysArr.map(d=>{
    const used = new Set(Object.keys(bookings[d.iso]||{}).filter(k=>k.startsWith(oid+"-seat-")).map(baseId)).size;
    sum += used;
    const pct = total ? Math.round(used/total*100) : 0;
    const h = Math.max(3, Math.round(Math.min(pct,100)*0.82));
    const cls = pct>=100 ? "full" : (pct<40 ? "low" : "");
    return '<div class="occ-col"><span class="occ-pct">'+pct+'%</span>' +
      '<div class="occ-bar '+cls+'" style="height:'+h+'px"></div>' +
      '<span class="occ-lbl">'+d.dow+'<br>'+d.num+'</span></div>';
  }).join("");
  const avg = (total && daysArr.length) ? Math.round(sum/(daysArr.length*total)*100) : 0;
  return {cols, avg};
}

    '<button class="'+(occTab==="heat"?"active":"")+'" onclick="setOccTab(\'heat\')">Calor</button>' +

    });

    html += '<div class="occ-office" style="margin-top:12px"><div class="occ-title">🏠 Teletrabalho</div>' +

      daysArr.map(d=>{
        const c = Object.keys(remoteDays[d.iso]||{}).length;
        return '<span class="pbadge" style="'+(c?'background:#EEF0FA;color:#3B5BFF;border:1px solid #C9D2F2':'')+'">'+d.dow+' '+d.num+' · '+c+'</span>';

    html += '<div class="hint">Percentagem de lugares sentados reservados por dia (meias-jornadas contam como presença)</div>';

        s.days.add(dateIso);

      });

    Object.keys(remoteDays).forEach(iso=>{
      if(iso < cutIso || iso > TODAY) return;
      Object.keys(remoteDays[iso]).forEach(n=>{

        '</table></div>' +
        '<div class="hint">«Sem check-in» conta reservas passadas em que não foi feito check-in na app — só é fiável se a equipa usar o check-in.</div>';
    }
  }

  html += '</main>';
  app.innerHTML = html;
}

/* ═══ Administração ═══ */
/* ── Pintura por arrasto e Anular ── */
let admPainting = false, admStroke = {}, admStrokePushed = false, admHadDown = false;
let admZone = null;        // {a:[r,c], b:[r,c]|null} — seleção de zona
let admClipboard = null;   // {w,h,cells:{},diags:{},walls:{}} — relativo
const admUndoStack = [];
function pushUndo(){
  const o = getOffice(admOfficeId);
  admUndoStack.push(JSON.stringify({id:o.id, cells:o.cells, walls:o.walls||{}, diags:o.diags||{}, parking:o.parking||[], cols:o.cols, rows:o.rows}));
  if(admUndoStack.length > 30) admUndoStack.shift();
}
function admUndo(){
  if(!admUndoStack.length){ showToast("Nada para anular"); return; }
  const snap = JSON.parse(admUndoStack.pop());
  const o = getOffice(snap.id) || getOffice(admOfficeId);
  o.cells = snap.cells; o.walls = snap.walls; o.diags = snap.diags||{}; if(snap.parking) o.parking = snap.parking; o.cols = snap.cols; o.rows = snap.rows;
  saveAll(); render();
}
function admPaintDown(){ admPainting = true; admHadDown = true; admStroke = {}; admStrokePushed = false; }
document.addEventListener("mouseup", ()=>{ admPainting = false; });
function admClickOK(){ if(admHadDown){ admHadDown = false; return false; } return true; }
function admMark(key){
  if(admPainting){
    if(admStroke[key]) return false;
    admStroke[key] = 1;
    if(!admStrokePushed){ pushUndo(); logAdmin("editou a planta de "+getOffice(admOfficeId).name); admStrokePushed = true; }
  } else { pushUndo(); logAdmin("editou a planta de "+getOffice(admOfficeId).name); }
  return true;
}
const WALL_TOOLS = {wall:1, door:2, wwin:3, wfurn:4};

function admCell(r, c){
  if(WALL_TOOLS[admTool]) return; // ferramentas de aresta não atuam nas células
  const o = getOffice(admOfficeId);
  if(admTool==="zone"){
    if(!admZone || admZone.b){ admZone = {a:[r,c], b:null}; showToast("Canto 1 marcado — toca no canto oposto"); }
    else { admZone.b = [r,c]; showToast("Zona selecionada — usa «Copiar seleção»"); }
    render(); return;
  }
  if(admTool==="paste"){
    if(!admClipboard){ showToast("Nada copiado — seleciona uma zona primeiro"); return; }
    pushUndo();
    const cb = admClipboard;
    Object.keys(cb.cells).forEach(k=>{
      const [dr,dc] = k.split(",").map(Number);
      const nr = r+dr, ncol = c+dc;
      if(nr<o.rows && ncol<o.cols) o.cells[nr+","+ncol] = JSON.parse(JSON.stringify(cb.cells[k]));
    });
    Object.keys(cb.diags).forEach(k=>{
      const [dr,dc] = k.split(",").map(Number);
      const nr = r+dr, ncol = c+dc;
      if(nr<o.rows && ncol<o.cols){ o.diags = o.diags||{}; o.diags[nr+","+ncol] = cb.diags[k]; }
    });
    Object.keys(cb.walls).forEach(k=>{
      const [or_, rc] = k.split(":");
      const [dr,dc] = rc.split(",").map(Number);
      const nr = r+dr, ncol = c+dc;
      const okH = or_==="h" && nr<=o.rows && ncol<o.cols;
      const okV = or_==="v" && nr<o.rows && ncol<=o.cols;
      if(okH||okV){ o.walls = o.walls||{}; o.walls[or_+":"+nr+","+ncol] = cb.walls[or_+":"+rc]; }
    });
    saveAll(); render();
    showToast("Zona colada ("+cb.w+"×"+cb.h+")");
    return;
  }
  const key = r+","+c;
  const cell = o.cells[key];
  const bookable = k => k==="ind"||k==="cow";
  if(admTool==="label" && admPainting && Object.keys(admStroke).length) return; // etiqueta só por toque
  if(!admMark("c:"+key)) return;
  if(admTool==="erase"){ delete o.cells[key]; if(o.diags) delete o.diags[key]; }
  else if(admTool==="diag"){
    o.diags = o.diags || {};
    /* ciclo: ╲ → ╱ → ╲ larga (2 células horiz.) → ╱ larga → ╲ alta (2 células vert.) → ╱ alta → remover */
    const cur = o.diags[key] || 0;
    const next = cur >= 6 ? 0 : cur + 1;
    if(next===0){ delete o.diags[key]; showToast("Diagonal removida"); }
    else {
      o.diags[key] = next;
      const names = {1:"╲ 1 célula", 2:"╱ 1 célula", 3:"╲ larga — 2 células", 4:"╱ larga — 2 células", 5:"╲ alta — 2 células", 6:"╱ alta — 2 células"};
      showToast("Diagonal: "+names[next]+" (toca de novo para mudar)");
    }
  }
  else if(admTool==="rot"){
    if(cell && ["ind","cow","tv","wc","copa"].includes(cell.kind)){
      const order = ["s","w","n","e"];
      cell.dir = order[(order.indexOf(cell.dir||"s")+1) % 4];
    }
  }
  else if(admTool==="jan"){ if(cell && (cell.kind==="ind"||cell.kind==="cow")) cell.jan = !cell.jan; }
  else if(admTool==="block"){
    if(cell && bookable(cell.kind)){
      if(cell.blocked){ cell.blocked = false; delete cell.blockedBy; }
      else if(admPainting && Object.keys(admStroke).length > 1){ cell.blocked = true; } // arrasto: bloquear sem prompt
      else {
        const n = prompt("Lugar fixo de quem? (deixa vazio para bloquear sem nome — ex.: avaria)", "");
        if(n===null){ admUndoStack.pop(); return; }
        cell.blocked = true;
        if(n.trim()) cell.blockedBy = n.trim(); else delete cell.blockedBy;
      }
    }
  }
  else if(admTool==="label"){
    if(cell && cell.kind==="label"){ delete o.cells[key]; }
    else {
      const t = prompt("Texto da etiqueta (ex.: Receção, Escada, Zona RH):", "");
      if(t===null){ admUndoStack.pop(); return; }
      let w = parseInt(prompt("Largura em quadrados (1–8):", "1")||"1")||1;
      let h = parseInt(prompt("Altura em quadrados (1–8):", "1")||"1")||1;
      w = Math.max(1, Math.min(8, Math.min(w, o.cols - c)));
      h = Math.max(1, Math.min(8, Math.min(h, o.rows - r)));
      o.cells[key] = {kind:"label", text:(t||"ZONA").toUpperCase().slice(0,16), w, h};
    }
  }
  else { /* ind / cow / park / plant */
    if(cell && cell.kind===admTool){ delete o.cells[key]; }
    else {
      const keepAttrs = cell && bookable(cell.kind) && bookable(admTool);
      o.cells[key] = keepAttrs ? Object.assign({}, cell, {kind:admTool}) : {kind:admTool};
    }
  }
  saveAll(); render();
}

function admEdge(or_, r, c){
  const val = WALL_TOOLS[admTool];
  if(!val && admTool!=="erase") return;
  const o = getOffice(admOfficeId);
  o.walls = o.walls || {};
  const key = or_+":"+r+","+c;
  if(!admMark("e:"+key)) return;
  if(admTool==="erase"){ delete o.walls[key]; }
  else if(o.walls[key]===val){ delete o.walls[key]; }
  else o.walls[key] = val;
  saveAll(); render();
}

/* Inserir/eliminar linha ou coluna numa posição específica.
   axis "r"=linha, "c"=coluna · delta -1 elimina em pos, +1 insere antes de pos */
function admShift(axis, pos, delta){
  const o = getOffice(admOfficeId);
  const isRow = axis==="r";
  const size = isRow ? o.rows : o.cols;
  if(delta<0 && size<=3){ showToast("Mínimo de 3 "+(isRow?"linhas":"colunas")); return; }
  if(delta>0 && size>=16){ showToast("Máximo de 16 "+(isRow?"linhas":"colunas")); return; }
  pushUndo();
  const nc = {};
  Object.keys(o.cells).forEach(k=>{
    let [r,c] = k.split(",").map(Number);
    let v = isRow ? r : c;
    if(delta<0){ if(v===pos) return; if(v>pos) v--; }
    else { if(v>=pos) v++; }
    if(isRow) r=v; else c=v;
    nc[r+","+c] = o.cells[k];
  });
  o.cells = nc;
  const nd = {};
  Object.keys(o.diags||{}).forEach(k=>{
    let [r,c] = k.split(",").map(Number);
    let v = isRow ? r : c;
    if(delta<0){ if(v===pos) return; if(v>pos) v--; }
    else { if(v>=pos) v++; }
    if(isRow) r=v; else c=v;
    nd[r+","+c] = o.diags[k];
  });
  o.diags = nd;
  const nw = {};
  Object.keys(o.walls||{}).forEach(k=>{
    const [or_, rc] = k.split(":");
    let [r,c] = rc.split(",").map(Number);
    const boundary = (isRow && or_==="h") || (!isRow && or_==="v"); // aresta indexada pela fronteira
    let v = isRow ? r : c;
    if(delta<0){
      if(boundary){ if(v>pos) v--; }
      else { if(v===pos) return; if(v>pos) v--; }
    } else {
      if(boundary){ if(v>=pos+1) v++; }
      else { if(v>=pos) v++; }
    }
    if(isRow) r=v; else c=v;
    nw[or_+":"+r+","+c] = o.walls[k];
  });
  o.walls = nw;
  if(isRow) o.rows += delta; else o.cols += delta;
  saveAll(); render();
  showToast(delta<0 ? (isRow?"Linha eliminada":"Coluna eliminada") : (isRow?"Linha inserida":"Coluna inserida"));
}

function admGrid(dim, delta){
  const o = getOffice(admOfficeId);
  const v = Math.max(4, Math.min(16, o[dim]+delta));
  if(v===o[dim]) return;
  pushUndo();
  o[dim] = v;
  Object.keys(o.cells).forEach(k=>{
    const [r,c] = k.split(",").map(Number);
    if(r>=o.rows || c>=o.cols) delete o.cells[k];
  });
  o.walls = o.walls || {};
  Object.keys(o.walls).forEach(k=>{
    const [or_, rc] = k.split(":");
    const [r,c] = rc.split(",").map(Number);
    if(or_==="h" ? (r>o.rows || c>=o.cols) : (r>=o.rows || c>o.cols)) delete o.walls[k];
  });
  saveAll(); render();
}

function admZoneCopy(){
  if(!admZone || !admZone.b){ showToast("Marca os dois cantos da zona primeiro"); return; }
  const o = getOffice(admOfficeId);
  const r0 = Math.min(admZone.a[0], admZone.b[0]), r1 = Math.max(admZone.a[0], admZone.b[0]);
  const c0 = Math.min(admZone.a[1], admZone.b[1]), c1 = Math.max(admZone.a[1], admZone.b[1]);
  const cb = {w:c1-c0+1, h:r1-r0+1, cells:{}, diags:{}, walls:{}};
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const k = r+","+c, rel = (r-r0)+","+(c-c0);
    if(o.cells[k]) cb.cells[rel] = JSON.parse(JSON.stringify(o.cells[k]));
    if((o.diags||{})[k]) cb.diags[rel] = o.diags[k];
  }
  Object.keys(o.walls||{}).forEach(k=>{
    const [or_, rc] = k.split(":");
    const [r,c] = rc.split(",").map(Number);
    const inH = or_==="h" && r>=r0 && r<=r1+1 && c>=c0 && c<=c1;
    const inV = or_==="v" && r>=r0 && r<=r1 && c>=c0 && c<=c1+1;
    if(inH||inV) cb.walls[or_+":"+(r-r0)+","+(c-c0)] = o.walls[k];
  });
  admClipboard = cb;
  admZone = null;
  render();
  showToast("Zona copiada ("+cb.w+"×"+cb.h+") — muda de escritório se quiseres e usa «Colar»");
}

function admBgUpload(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = function(){
    const maxW = 1400;
    const scale = Math.min(1, maxW / img.width);
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width*scale);
    cv.height = Math.round(img.height*scale);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const data = cv.toDataURL("image/jpeg", 0.7);
    if(data.length > 2500000){ showToast("Imagem demasiado grande — usa uma versão mais pequena"); return; }
    const o = getOffice(admOfficeId);
    o.bg = data; o.bgShow = true;
    saveAll(); render();
    showToast("Planta carregada");
  };
  img.onerror = ()=>showToast("Não foi possível ler a imagem");
  const reader = new FileReader();
  reader.onload = e=>{ img.src = e.target.result; };
  reader.readAsDataURL(f);
}
function admBgToggle(v){ const o=getOffice(admOfficeId); o.bgShow=v; saveAll(); render(); }
function admBgRemove(){ const o=getOffice(admOfficeId); o.bg=""; o.bgShow=false; saveAll(); render(); }

function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime||"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function monthlyReport(){

  const offStats = config.offices.map(o=>{
    const total = derive(o).seats.filter(s=>!s.blocked).length;
    const daysSet = {}, useByDay = {};
    Object.keys(bookings).forEach(dateIso=>{
      if(dateIso < cutIso || dateIso > TODAY) return;
      Object.keys(bookings[dateIso]).forEach(k=>{
        if(!k.startsWith(o.id+"-seat-")) return;
        daysSet[dateIso]=1;
        useByDay[dateIso] = (useByDay[dateIso]||new Set());
        useByDay[dateIso].add(baseId(k));
      });
    });
    const nDays = Object.keys(daysSet).length;
    let sum = 0;
    Object.values(useByDay).forEach(s=>sum+=s.size);
    const avg = (total && nDays) ? Math.round(sum/(nDays*total)*100) : 0;
    return {name:o.name, total, avg, nDays};
  });
  const people = {};
  Object.keys(bookings).forEach(dateIso=>{
    if(dateIso < cutIso || dateIso > TODAY) return;

      if(dateIso < TODAY && !b.checkedIn) p.noshow++;
    });
  });

    '@media print{.btn{display:none}}</style></head><body>' +
    '<div class="top"><div><h1>DigiSpot</h1><div class="tag">DIGIT — BEYOND NUMBERS</div></div>' +
    '<div style="text-align:right"><b>Relatório mensal de ocupação</b><div class="sub">Últimos 30 dias · gerado em '+fmtDate(TODAY)+'</div></div></div>' +

function exportPlanPng(){
  const o = getOffice(admOfficeId);
  const svgStr = mapHtml(o, {admin:false}).match(/<svg[\s\S]*<\/svg>/)[0];
  const HEAD = 74;
  const img = new Image();
  const blob = new Blob([svgStr.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')], {type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);
  img.onload = function(){
    const scale = 2;
    const cv = document.createElement("canvas");
    cv.width = img.width*scale;
    cv.height = img.height*scale + HEAD*scale;
    const g = cv.getContext("2d");
    g.fillStyle = "#FFFFFF"; g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle = "#1F6FEB"; g.fillRect(0,0,cv.width,6*scale);
    g.fillStyle = "#1F6FEB"; g.font = "800 "+(22*scale)+"px Calibri, sans-serif";
    g.fillText("DigiSpot", 16*scale, 34*scale);
    g.fillStyle = "#8B97A5"; g.font = "700 "+(10*scale)+"px Calibri, sans-serif";
    g.fillText("DIGIT — BEYOND NUMBERS", 16*scale, 50*scale);
    g.fillStyle = "#0E182B"; g.font = "800 "+(15*scale)+"px Calibri, sans-serif";
    const t = "Escritório "+o.name;
    g.fillText(t, cv.width-16*scale-g.measureText(t).width, 34*scale);
    g.fillStyle = "#8B97A5"; g.font = (10*scale)+"px Calibri, sans-serif";
    const d = "Planta · "+fmtDate(TODAY);
    g.fillText(d, cv.width-16*scale-g.measureText(d).width, 50*scale);
    g.drawImage(img, 0, HEAD*scale, img.width*scale, img.height*scale);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "digispot-planta-"+o.id+".png";
    a.click();
    showToast("Planta exportada em PNG — para imprimir, abre a imagem e Ctrl+P");
  };
  img.onerror = ()=>showToast("Não foi possível gerar a imagem");
  img.src = url;
}

function importOffice(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const d = JSON.parse(e.target.result);
      if(d.digispot==="config" && d.config){
        if(!confirm("Substituir TODA a configuração (escritórios, regras, dias de equipa)?")) return;
        config = mergeConfig(d.config);
        saveAll(); render();
        showToast("Configuração completa importada");
        return;
      }
      if(d.digispot!=="office" || !d.cells || !d.cols || !d.rows) throw new Error("formato");
      pushUndo();
      const o = getOffice(admOfficeId);
      o.name = d.name || o.name; o.room = d.room || o.room;
      o.cols = Math.max(3, Math.min(16, d.cols)); o.rows = Math.max(3, Math.min(16, d.rows));
      o.cells = d.cells; o.walls = d.walls||{}; o.diags = d.diags||{};
      o.bg = d.bg||""; o.bgShow = !!d.bgShow;
      if(d.parking) o.parking = d.parking; else { delete o.parking; migrateOfficeParking(o); }
      saveAll(); render();
      showToast("Escritório importado — "+esc(o.name));
    }catch(err){ showToast("Ficheiro inválido — exporta primeiro a partir do DigiSpot"); }
  };
  reader.readAsText(f);
  ev.target.value = "";
}

function admAddAdmin(){
  const n = document.getElementById("naName"), p = document.getElementById("naPin");
  if(!n || !n.value.trim()){ showToast("Indica o nome"); return; }
  if(!p || p.value.length < 4){ showToast("PIN com pelo menos 4 dígitos"); return; }
  config.admins = config.admins || [];
  config.admins.push({name:n.value.trim(), pin:p.value});
  logAdmin("adicionou administrador "+n.value.trim());
  n.value=""; p.value="";
  saveAll(); render();
  showToast("Administrador adicionado");
}
function admDelAdmin(i){
  const a = (config.admins||[])[i];
  if(!a) return;
  if(!confirm("Remover o administrador "+a.name+"?")) return;
  config.admins.splice(i,1);
  logAdmin("removeu administrador "+a.name);
  saveAll(); render();
}
function admChangePin(){
  const cur = document.getElementById("pinCur"), nv = document.getElementById("pinNew");
  if(!cur || !nv) return;
  if(cur.value !== config.pin){ showToast("PIN atual incorreto"); return; }
  if(!nv.value || nv.value.length < 4){ showToast("O novo PIN deve ter pelo menos 4 dígitos"); return; }
  config.pin = nv.value;
  logAdmin("alterou o PIN mestre");
  cur.value=""; nv.value="";
  saveAll();
  showToast("PIN alterado");
}

    '<div class="adm-actions" style="margin-top:10px"><button class="btn-sm" onclick="admResetOffice()">Repor layout padrão</button></div>' +
    '</div>';

  /* ═══ Estacionamento — parque próprio de cada escritório ═══ */
  const pk = o.parking || [];
  html += '<div class="adm-card"><h4>Estacionamento · '+esc(o.name)+' <span style="font-weight:400; color:#8B97A5; font-size:12px">('+pk.length+' lugar'+(pk.length===1?'':'es')+')</span></h4>' +
    '<div class="adm-note" style="margin:0 0 10px">O parque de cada escritório é independente da planta — por norma <b>2 lugares por escritório</b>. O desenho abaixo atualiza-se automaticamente e é o que a equipa vê no separador Estacionamento.</div>' +
    parkingLotHtml(o, {static:true}) +
    pk.map((p,i)=>{
      const estado = p.blocked ? (p.blockedBy ? "🔒 Lugar fixo de <b>"+esc(p.blockedBy)+"</b>" : "🔒 Bloqueado (avaria/indisponível)") : "Disponível para reserva";
      return '<div class="adm-row"><label>P'+(i+1)+' — <span style="font-weight:400">'+estado+'</span></label>' +
        '<span style="display:flex; gap:6px">' +
        '<button class="btn-sm" onclick="admParkFix('+i+')">👤 Titular</button>' +
        '<button class="btn-sm" onclick="admParkBlock('+i+')">'+(p.blocked && !p.blockedBy ? "🔓 Desbloquear" : "🔒")+'</button>' +
        '<button class="btn-sm danger" onclick="admParkDel('+i+')">×</button>' +
        '</span></div>';
    }).join("") +
    '<div class="adm-actions" style="margin-top:8px"><button class="btn-sm ok" onclick="admParkAdd()">＋ Adicionar lugar</button></div>' +
    '</div>';

  html += '<div class="adm-grid2">';
  /* Exportar / Importar */
  html += '<div class="adm-card"><h4>Exportar / Importar escritório</h4>' +
    '<div class="adm-actions">' +
    '<button class="btn-sm" onclick="exportPlanPng()">🖼 Planta em PNG</button>' +
    '<button class="btn-sm" onclick="exportOffice()">⬇ Exportar '+esc(o.name)+'</button>' +
    '<button class="btn-sm" onclick="exportAllConfig()">⬇ Exportar tudo</button>' +
    '<label class="btn-sm" style="cursor:pointer">⬆ Importar<input type="file" accept="application/json,.json" onchange="importOffice(event)" style="display:none"></label>' +
    '</div>' +
    '<div class="adm-note">O ficheiro JSON guarda a planta completa deste escritório (lugares, paredes, diagonais, móveis, planta de fundo e nomes) — usa-o como cópia de segurança ou para transferir entre browsers/instalações. «Exportar tudo» inclui os três escritórios, regras, dias de equipa e administração; importado, substitui a configuração atual.</div>' +
    '</div>';

  /* Planta */
  html += '<div class="adm-card"><h4>Planta do escritório (imagem de fundo)</h4>' +
    '<div class="adm-row"><label>Carregar planta (foto ou desenho)</label><input type="file" accept="image/*" onchange="admBgUpload(event)" style="max-width:190px; font-size:12px"></div>' +
    (o.bg ? '<div class="adm-row"><label>Mostrar planta no mapa</label><label class="switch"><input type="checkbox" '+(o.bgShow?"checked":"")+' onchange="admBgToggle(this.checked)"><span class="slider"></span></label></div>' +
      '<div class="adm-actions"><button class="btn-sm danger" onclick="admBgRemove()">Remover planta</button></div>' : '') +
    '<div class="adm-note">A imagem fica por baixo da grelha — ajusta as colunas/linhas e a posição dos lugares para coincidirem com a planta real. Usa uma imagem leve (é guardada no browser'+(SYNC_URL?'/servidor':'')+').</div>' +
    '</div>';

  /* Dias de equipa */
  const tds = Object.keys(config.teamDays).sort();
  html += '<div class="adm-card"><h4>Dias de equipa</h4>' +
    '<div class="adm-row"><label>Data</label><input type="date" id="tdDate" min="'+TODAY+'"></div>' +
    '<div class="adm-row"><label>Escritório</label><select id="tdOffice">'+config.offices.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></div>' +
    '<div class="adm-row"><label>Descrição</label><input type="text" id="tdLabel" placeholder="Dia da Equipa Digit"></div>' +
    '<div class="adm-actions"><button class="btn-sm ok" onclick="admTeamDayAdd()">Marcar dia de equipa</button></div>' +
    (tds.length ? tds.map(iso=>{
      const t = config.teamDays[iso];
      const to = getOffice(t.officeId);
      return '<div class="adm-row" style="margin-top:10px"><label>⭐ '+fmtDate(iso)+' · '+esc(t.label)+(to?' · '+esc(to.name):'')+'</label>' +
        '<button class="btn-sm danger" onclick="admTeamDayDel(\''+iso+'\')">Remover</button></div>';
    }).join("") : '') +
    '<div class="adm-note">Os dias de equipa aparecem com ⭐ no calendário de reservas e com um banner no dia — para incentivar a equipa a reservar lugar nesse escritório.</div>' +
    '</div>';

  /* Regras */
  const R = config.rules;
  html += '<div class="adm-card"><h4>Regras de reserva</h4>' +
    '<div class="adm-row"><label>Antecedência máxima (dias úteis)</label><input type="number" min="3" max="60" value="'+R.maxAdvanceDays+'" onchange="admRule(\'maxAdvanceDays\', this.value)"></div>' +
    '<div class="adm-row"><label>Máximo 1 lugar sentado por pessoa/período</label><label class="switch"><input type="checkbox" '+(R.oneSeatPerDay?"checked":"")+' onchange="admRule(\'oneSeatPerDay\', this.checked)"><span class="slider"></span></label></div>' +
    '<div class="adm-row"><label>Libertar lugares sem check-in</label><label class="switch"><input type="checkbox" '+(R.autoRelease?"checked":"")+' onchange="admRule(\'autoRelease\', this.checked)"><span class="slider"></span></label></div>' +
    (R.autoRelease ? '<div class="adm-row"><label>Hora limite do check-in (manhã/dia)</label><input type="time" value="'+esc(R.autoReleaseTime)+'" onchange="admRule(\'autoReleaseTime\', this.value)"></div>' +
      '<div class="adm-note">Reservas de tarde são libertadas a partir das 14:30 sem check-in.</div>' : '') +
    '<div class="adm-note">Numa app estática, a libertação corre quando alguém abre a app depois da hora limite. Com o n8n ligado, corre de forma garantida no servidor.</div>' +
    '</div>';

  /* Reservas */
  const all = [];
  Object.keys(bookings).sort().forEach(dateIso=>{
    if(dateIso < TODAY) return;
    Object.entries(bookings[dateIso]).forEach(([key, b])=>all.push({dateIso, key, b}));
  });
  html += '<div class="adm-card"><h4>Reservas futuras · '+all.length+'</h4>';
  if(!all.length) html += '<div class="adm-note">Sem reservas futuras.</div>';
  else {
    all.slice(0, 40).forEach(({dateIso, key, b})=>{
      html += '<div class="mybk-item"><div class="info">' +
        '<div class="t">'+esc(describeSpot(key))+'</div>' +
        '<div class="s">'+fmtDate(dateIso)+' · '+esc(occupantOf(b))+(b.by&&b.by!==b.name?' (por '+esc(firstName(b.by))+')':'')+(b.checkedIn?' · ✓':'')+'</div>' +
        '</div><div class="mybk-actions">' +
        '<button class="btn-sm danger" onclick="cancelSpot(\''+key+'\', \''+dateIso+'\', true)">Cancelar</button>' +
        '</div></div>';
    });
    if(all.length > 40) html += '<div class="adm-note">A mostrar as primeiras 40. Exporta o CSV para ver tudo.</div>';
  }
  html += '<div class="adm-actions" style="margin-top:8px"><button class="btn-sm" onclick="exportCsv()">Exportar CSV (Excel)</button>' +
    '<button class="btn-sm" onclick="monthlyReport()">📄 Relatório mensal (PDF)</button></div></div>';

  /* Quadro de avisos */
  const oNotices = (config.notices||{})[admOfficeId] || [];
  html += '<div class="adm-card"><h4>📌 Quadro de avisos · '+esc(o.name)+'</h4>' +
    oNotices.map((n,i)=>'<div class="adm-row"><label style="font-weight:400">'+esc(n.text)+'<br><span style="font-size:11px; color:#A5B0BF">'+esc(n.by||"")+'</span></label>' +
      '<button class="btn-sm danger" onclick="admNoticeDel('+i+')">×</button></div>').join("") +
    '<div class="adm-row"><input type="text" id="ntText" placeholder="Ex.: Obras no WC esta semana" maxlength="120" style="flex:1"></div>' +
    '<div class="adm-actions"><button class="btn-sm ok" onclick="admNoticeAdd()">Publicar aviso</button></div>' +
    '<div class="adm-note" style="margin-top:8px">Os avisos aparecem no topo da vista Reservar deste escritório, para toda a equipa.</div>' +
    '</div>';

  /* Avarias reportadas */
  const fKeys = Object.keys(faults);
  html += '<div class="adm-card"><h4>⚠️ Avarias reportadas <span style="font-weight:400; color:#8B97A5; font-size:12px">('+fKeys.length+')</span></h4>' +
    (fKeys.length ? fKeys.map(k=>{
      const f = faults[k];
      const d = new Date(f.ts);
      return '<div class="adm-row"><label>'+esc(describeSpot(k))+' — <span style="font-weight:400">'+esc(f.note)+'</span><br>' +
        '<span style="font-size:11px; color:#A5B0BF">'+esc(firstName(f.by))+' · '+d.getDate()+' '+MESES[d.getMonth()]+'</span></label>' +
        '<button class="btn-sm ok" onclick="admFaultFix(\''+k+'\')">Resolvida</button></div>';
    }).join("") : '<div class="adm-note" style="margin:0">Sem avarias por resolver. Os colaboradores reportam avarias no painel de cada lugar.</div>') +
    '</div>';

  /* Administradores e registo */
  const admins = config.admins || [];
  const audit = config.audit || [];
  html += '<div class="adm-card"><h4>Administradores · '+(admins.length+1)+'</h4>' +
    '<div class="adm-row"><label>PIN mestre (sempre válido)</label><span style="color:#8B97A5; font-size:12px">definido em Segurança</span></div>' +
    admins.map((a,i)=>'<div class="adm-row"><label>👤 '+esc(a.name)+'</label><button class="btn-sm danger" onclick="admDelAdmin('+i+')">Remover</button></div>').join("") +
    '<div class="adm-row"><label>Nome</label><input type="text" id="naName" placeholder="Ex.: Margarida"></div>' +
    '<div class="adm-row"><label>PIN próprio</label><input type="password" id="naPin" inputmode="numeric"></div>' +
    '<div class="adm-actions"><button class="btn-sm ok" onclick="admAddAdmin()">Adicionar administrador</button></div>' +
    (audit.length ? '<div class="section-title" style="margin-top:16px">Registo de alterações</div>' +
      audit.slice(0,15).map(a=>{
        const d = new Date(a.ts);
        return '<div style="font-size:12px; color:#5C6B7E; padding:4px 0; border-bottom:1px solid #F1F2F6">' +
          '<b>'+esc(a.who)+'</b> '+esc(a.action)+' <span style="color:#A5B0BF">· '+d.getDate()+' '+MESES[d.getMonth()]+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</span></div>';
      }).join("") : '') +
    '</div>';

  /* Segurança */
  html += '<div class="adm-card"><h4>Segurança</h4>' +
    '<div class="adm-row"><label>PIN atual</label><input type="password" id="pinCur" inputmode="numeric"></div>' +
    '<div class="adm-row"><label>Novo PIN</label><input type="password" id="pinNew" inputmode="numeric"></div>' +
    '<div class="adm-actions"><button class="btn-sm" onclick="admChangePin()">Alterar PIN</button></div>' +
    (config.pin===DEFAULT_PIN ? '<div class="adm-note">⚠ O PIN de administração ainda é o inicial ('+DEFAULT_PIN+'). Recomenda-se alterá-lo.</div>' : '') +
    '</div>';

  html += '</div></main>';
  app.innerHTML = html;
}

/* ── Arranque ── */
(async function init(){
  applyTheme();
  let _rz; window.addEventListener("resize", ()=>{
    clearTimeout(_rz);
    _rz = setTimeout(()=>{ if(user && !modalState) render(); }, 200);
  });
  await restoreSession();
  await loadAll();
  if(user && profiles[user] && profiles[user].defaultOffice && getOffice(profiles[user].defaultOffice)) officeId = profiles[user].defaultOffice;
  dateSel = getDays()[0].iso;
  runAutoRelease();
  renderNav();
  render();
  if(SB || SYNC_URL){
    setInterval(async ()=>{
      await loadAll();
      runAutoRelease();
      if(!modalState && view!=="admin") render();
    }, SYNC_INTERVAL_MS);
  }
})();
</script>
</body>
</html>
