  body{margin:0; font-family:Calibri,'Segoe UI',-apple-system,sans-serif; background:var(--bg); color:var(--navy); min-height:100vh; padding-bottom:76px; overflow-x:hidden;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{display:none;}

  .login-wrap{min-height:100vh; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--card); border-radius:20px; padding:40px 36px; max-width:380px; width:100%; box-shadow:0 10px 40px rgba(14,24,43,.10);}
  .brand{font-size:30px; font-weight:800; color:var(--indigo); letter-spacing:-.5px;}
  .tagline{font-size:13px; color:var(--mist); margin:4px 0 28px; letter-spacing:.4px;}
  .login-card p{font-size:15px; line-height:1.5; margin:0 0 20px;}
  .login-card input{width:100%; padding:13px 14px; font-size:15px; border:1.5px solid var(--line); border-radius:12px; outline:none; margin-bottom:14px; color:var(--navy);}
  .login-card input:focus{border-color:var(--indigo);}
  .btn-primary{width:100%; padding:13px 0; background:var(--indigo); color:#fff; font-size:15px; font-weight:700; border:none; border-radius:12px;}
  .btn-primary:active{background:var(--indigo-dark);}
  .login-note{font-size:12px; color:var(--mist); margin-top:16px; line-height:1.4;}
  .login-col{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center;}
  .login-col .login-card{max-width:none; width:100%; border-radius:16px; padding:32px 30px 26px;}
  .login-logo{width:190px; margin-bottom:4px;}
  .login-tag{font-size:14px; color:#5C6B7E; margin-bottom:24px;}
  .login-h1{font-family:Georgia,'Times New Roman',serif; font-size:26px; font-weight:700; margin:0 0 8px; color:var(--navy);}
  .login-sub{font-size:14.5px; color:#5C6B7E; margin:0 0 18px;}
  .email-row{display:flex; gap:8px; margin-bottom:14px;}
  .email-row input{margin-bottom:0; flex:1; min-width:0;}
  .email-dom{flex:0 0 auto; display:flex; align-items:center; padding:0 14px; border:1.5px solid var(--line); border-radius:12px; background:#F4F7FD; color:var(--indigo); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  .email-dom:active{background:var(--indigo); color:#fff; border-color:var(--indigo);}
  .pass-wrap{position:relative; margin-bottom:12px;}
  .pass-wrap input{margin-bottom:0; padding-right:46px;}
  .eye-btn{position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--mist); padding:6px; display:flex;}
  .remember{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--navy); margin:2px 0 18px; cursor:pointer;}
  .remember input{width:16px; height:16px; margin:0; accent-color:var(--indigo);}
  .login-forgot{display:block; text-align:center; font-size:13.5px; color:var(--navy); text-decoration:underline; margin-top:14px; cursor:pointer;}
  .login-signup{text-align:center; font-size:13.5px; color:var(--navy); margin-top:14px;}
  .login-signup a{color:var(--indigo); font-weight:700; cursor:pointer;}
  .login-foot{font-size:12.5px; color:var(--mist); margin-top:20px; text-align:center;}
  body.dark .login-card{background:#101B2E;}
  body.dark .email-dom{background:#1B2E52;}
  body.dark .login-tag, body.dark .login-sub{color:#93A1B5;}

  header{background:#fff; border-bottom:1px solid var(--line); padding:16px 20px 14px; position:sticky; top:0; z-index:10;}
  .head-inner{max-width:720px; margin:0 auto;}
  .head-top{display:flex; justify-content:space-between; align-items:baseline;}
  .head-brand{font-size:22px; font-weight:800; color:var(--indigo); letter-spacing:-.5px;}
  .head-tag{font-size:10.5px; color:var(--mist); margin-left:10px; letter-spacing:.7px; text-transform:uppercase;}
  .head-user{font-size:13px; color:var(--mist);}
  .head-user b{color:var(--navy);}
  .head-user button{background:none; border:none; color:var(--mist); font-size:11px; margin-left:8px; text-decoration:underline;}
  .office-tabs{display:flex; gap:6px; padding-top:12px;}
  .office-tabs button{flex:1; padding:9px 0; border-radius:10px; border:none; font-size:13px; font-weight:700; background:var(--lavender); color:#5C6B7E;}
  .office-tabs button.active{background:var(--indigo); color:#fff;}
  header.slim{padding-bottom:14px;}

  main{max-width:720px; margin:0 auto; padding:16px 16px 24px;}

  .days-nav{display:flex; align-items:flex-start; gap:6px; margin-bottom:0;}
  .days-nav .dn{flex:0 0 auto; width:30px; height:58px; margin-top:0; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:17px; font-weight:800; color:var(--navy); cursor:pointer;}
  .days-nav .dn:disabled{opacity:.35; cursor:default;}
  .days{display:flex; gap:8px; overflow-x:auto; padding-bottom:14px; flex:1;}
  .day{flex:0 0 auto; min-width:60px; padding:8px 6px; border-radius:12px; border:1.5px solid var(--line); background:#fff; color:var(--navy); text-align:center; position:relative;}
  .day.active{background:var(--indigo); border-color:var(--indigo); color:#fff; box-shadow:0 4px 14px rgba(31,111,235,.35);}
  .day .dow{font-size:11px; opacity:.85;}
  .day .num{font-size:17px; font-weight:800; line-height:1.2;}
  .day .mes{font-size:10px; opacity:.7;}
  .day .cnt{font-size:9px; margin-top:2px; color:var(--mist);}
  .day.active .cnt{color:#D3E3FB;}
  .day .td{position:absolute; top:3px; right:5px; font-size:9px;}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .stat{background:#fff; border-radius:14px; padding:12px 8px; text-align:center; border:1px solid var(--line);}
  .stat .n{font-size:22px; font-weight:800;}
  .stat .n.mine{color:var(--indigo);}
  .stat .l{font-size:11px; color:var(--mist);}
  .stat .of{font-size:14px; font-weight:700; color:var(--mist); margin-left:2px;}
  .pf-av{width:44px; height:44px; border-radius:99px; background:linear-gradient(135deg, #1F6FEB, #0047F5); color:#fff; font-size:14px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; object-fit:cover; flex:0 0 auto;}
  img.pf-av{background:none;}

  .habitual{width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--indigo); background:#EAF1FC; color:var(--indigo); font-size:13.5px; font-weight:700; margin-bottom:14px; text-align:left;}
  .habitual.done{background:#E6F3EC; border-color:#3E9E70; color:#2E7A55;}
  .habitual.occ{background:var(--lavender); border-color:var(--line); color:var(--mist); cursor:default;}
  .quick-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:14px;}
  .quick-card .qt{font-size:12px; font-weight:700; color:var(--mist); margin-bottom:8px;}
  .quick-card .qt b{color:var(--indigo);}
  .quick-days{display:flex; gap:6px; flex-wrap:wrap;}
  .quick-days button{flex:0 0 auto; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:99px; border:1.5px solid var(--indigo); background:#EAF1FC; color:var(--indigo);}
  .quick-days button:active{background:var(--indigo); color:#fff;}
  .warn{background:#FAECEA; border:1px solid #F2D2CD; border-radius:12px; padding:10px 14px; font-size:13px; color:#C0392B; margin-bottom:14px; font-weight:600;}
  .notice{background:#FFF7E6; border:1px solid #F2E2B8; border-radius:12px; padding:10px 14px; font-size:13px; color:#8A6D1D; margin-bottom:10px; font-weight:600;}
  body.dark .notice{background:#33270E; border-color:#5A4A1E; color:#EBCB7A;}
  .teamday{background:#EAF5EF; border:1px solid #C4E3D2; border-radius:12px; padding:10px 14px; font-size:13px; color:#2E7A55; margin-bottom:14px; font-weight:600;}
  .sync-note{background:#fff; border:1px dashed var(--line); border-radius:12px; padding:10px 14px; font-size:12px; color:var(--mist); margin-bottom:14px; line-height:1.4;}

  .tabs{display:flex; gap:6px; background:#fff; border-radius:14px; padding:5px; margin-bottom:16px; border:1px solid var(--line);}
  .tabs button{flex:1; padding:10px 0; border-radius:10px; border:none; font-size:13.5px; font-weight:700; background:transparent; color:var(--mist); transition:background .15s;}
  .tabs button.active{background:var(--indigo); color:#fff;}

  .filters{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px;}
  .filters button{flex:0 0 auto; font-size:12px; font-weight:700; padding:7px 13px; border-radius:99px; border:1.5px solid var(--line); background:#fff; color:var(--mist);}
  .filters button.active{background:var(--navy); border-color:var(--navy); color:#fff;}

  .section-title{font-size:12px; font-weight:700; color:var(--mist); text-transform:uppercase; letter-spacing:.8px; margin:0 0 10px;}

  /* ── Mapa ── */
  .map-wrap{background:#fff; border:1px solid var(--line); border-radius:16px; padding:10px 12px 44px; margin-bottom:16px;}
  .map-scroll{overflow-x:auto;}
  .zoom-ctl{display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:8px; font-size:11.5px; font-weight:700; color:var(--mist);}
  .zoom-ctl button{width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-weight:800; color:var(--navy);}
  .zoom-ctl .undo-btn{width:auto; padding:0 10px; font-size:11.5px; margin-right:auto;}
  .map-stack{position:relative; width:max-content; margin:0 auto;}
  .map-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:fill; opacity:.42; border-radius:10px;}
  .map{display:grid; gap:6px; position:relative;}
  .mcell{width:48px; height:48px; border-radius:10px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; user-select:none; font-size:12px;}
  .mcell.empty{background:var(--lavender); opacity:.45;}
  .with-bg .mcell.empty{background:transparent; opacity:1; border:1px dashed rgba(31,111,235,.10);}
  .mcell.seat{border:1.5px solid var(--line); background:#fff; cursor:pointer; box-shadow:0 1px 2px rgba(14,24,43,.06);}
  .mcell.seat .lbl{font-size:12.5px; font-weight:800; line-height:1;}
  .mcell.seat .who{font-size:7.5px; line-height:1.1; color:var(--mist); max-width:46px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center;}
  .mcell.park{border:1.5px dashed #8B97A5; background:#F4F6F9; cursor:pointer;}
  .mcell.park .lbl{font-size:12.5px; font-weight:800;}
  .mcell.park .who{font-size:7.5px; color:var(--mist);}
  .mcell.busy{background:var(--busy); color:var(--mist); cursor:default;}
  .mcell.busy .lbl{color:var(--mist);}
  .mcell.half-am{background:linear-gradient(90deg, var(--busy) 50%, #fff 50%);}
  .mcell.half-pm{background:linear-gradient(90deg, #fff 50%, var(--busy) 50%);}
  .mcell.mine{background:var(--indigo); border-color:var(--indigo); color:#fff; box-shadow:0 4px 12px rgba(31,111,235,.30);}
  .mcell.mine .lbl,.mcell.mine .who{color:#fff;}
  .mcell.blocked{background:#EDEDF2; border-style:solid; border-color:#D5D5DE; color:#8B97A5; cursor:default;}
  .mcell.dim{opacity:.3; pointer-events:none;}
  .mcell .jan{position:absolute; top:2px; right:3px; font-size:8px;}
  .mcell .vb{position:absolute; top:-5px; left:-4px; background:var(--ok); color:#fff; font-size:7px; font-weight:700; padding:1px 4px; border-radius:99px;}
  .mcell .ck{position:absolute; bottom:-4px; right:-3px; background:var(--ok); color:#fff; font-size:8px; padding:0 3px; border-radius:99px;}

  .present{background:#fff; border-radius:14px; padding:14px 16px; border:1px solid var(--line); margin-bottom:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:13px; background:#E8F0FE; color:#1F6FEB; padding:5px 12px; border-radius:99px; font-weight:600;}
  .chip.me{background:var(--indigo); color:#fff;}
  .chip.vis{background:#E6F3EC; color:#2E7A55;}

  .modal.manual{max-width:660px; max-height:86vh; overflow-y:auto; text-align:left;}
  .mn-head{display:flex; justify-content:space-between; align-items:center; font-size:19px; font-weight:800; margin-bottom:4px;}
  .mn-intro{font-size:13px; color:var(--mist); margin:0 0 6px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .mn-sec{display:flex; gap:14px; margin:18px 0;}
  .mn-ic{width:30px; height:30px; border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:#E8F0FE; color:#1F6FEB;}
  .mn-ic svg{width:15px; height:15px;}
  body.dark .mn-ic{background:#1B2E52;}
  .mn-t{font-size:15px; font-weight:800; margin-bottom:4px;}
  .mn-bd p{font-size:13.5px; line-height:1.55; margin:5px 0; color:#3A4A61;}
  body.dark .mn-bd p{color:#B9C4D6;}
  .rh-row{display:flex; gap:5px; flex-wrap:wrap; margin:10px 0 8px;}
  .rh{padding:4px 8px; border-radius:8px; font-size:11px; font-weight:700;}
  .rh.free{background:#E6F3EC; color:#2E7A55;}
  .rh.mine{background:var(--indigo); color:#fff;}
  .rh.occ{background:#F1F2F6; color:#A5B0BF;}
  .rh-hint{font-size:11.5px; color:var(--mist);}
  .month-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:16px; font-weight:800;}
  .month-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  .month-hdr div{font-size:11px; font-weight:700; color:var(--mist); text-transform:uppercase; letter-spacing:.6px; text-align:center; padding-bottom:4px;}
  .mday{background:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 7px 8px; min-height:58px; cursor:pointer;}
  .mday.off{background:var(--lavender); opacity:.55; cursor:default;}
  .mday.mine{border-color:var(--indigo); background:#EAF1FC;}
  .mday.today{box-shadow:0 0 0 2px rgba(31,111,235,.35);}
  .md-top{display:flex; justify-content:space-between; align-items:baseline; font-size:11px;}
  .md-n{font-size:14px; font-weight:800;}
  .md-f{color:#C0392B; font-weight:800; font-size:10px;}
  .md-b{margin-top:5px; font-size:10.5px; font-weight:800; color:var(--indigo);}
  .md-c{margin-top:5px; font-size:10px; color:var(--mist);}
  .wl-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px;}
  .wl-card .t{font-size:14px; font-weight:800; margin-bottom:6px;}
  .wl-card .q{font-size:12.5px; color:var(--mist); margin-bottom:10px; line-height:1.4;}

  .room-card{background:#fff; border-radius:16px; padding:16px 16px 14px; border:1px solid var(--line);}
  .room-name{font-size:16px; font-weight:800; margin-bottom:4px;}
  .room-sub{font-size:12px; color:var(--mist); margin-bottom:14px;}
  .hours{display:grid; gap:8px;}
  .hour{display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-size:14px; font-weight:600; cursor:pointer; user-select:none;}
  .hour .who{font-size:12px;}
  .hour .meet{font-size:11px; opacity:.8; font-weight:400;}
  .hour.busy{background:var(--busy); color:var(--mist); cursor:default;}
  .hour.mine{background:var(--indigo); border-color:var(--indigo); color:#fff;}

  .legend{display:flex; gap:14px; justify-content:center; align-items:center; width:fit-content; margin:22px auto; text-align:center; font-size:12px; color:var(--mist); flex-wrap:wrap;}
  .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle;}
  .hint{text-align:center; margin-top:6px; font-size:11px; color:#A5B0BF;}

  .mybk-item{background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px;}
  .mybk-item .info .t{font-size:14.5px; font-weight:700;}
  .mybk-item .info .s{font-size:12px; color:var(--mist);}
  .mybk-item .info .s .vis{color:#2E7A55; font-weight:700;}
  .mybk-actions{display:flex; gap:6px; flex-shrink:0;}
  .btn-sm{font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--navy); white-space:nowrap;}
  .btn-sm.danger{color:#C0392B; border-color:#F0CBC6;}
  .btn-sm.ok{background:var(--ok); border-color:var(--ok); color:#fff;}
  .btn-sm.done{background:#E6F3EC; border-color:#E6F3EC; color:#2E7A55; cursor:default;}
  .empty-box{background:#fff; border:1px dashed var(--line); border-radius:14px; padding:26px 16px; text-align:center; color:var(--mist); font-size:14px;}

  .search-box{width:100%; padding:12px 14px; font-size:15px; border:1.5px solid var(--line); border-radius:12px; outline:none; margin-bottom:14px; color:var(--navy); background:#fff;}
  .search-box:focus{border-color:var(--indigo);}
  .person{background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:8px;}
  .person .ph{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .person .pn{font-size:15px; font-weight:800;}
  .person .fav-btn{background:none; border:none; font-size:18px; padding:2px 4px;}
  .person .pb{display:flex; flex-wrap:wrap; gap:6px;}
  .pbadge{font-size:12px; background:#E8F0FE; color:#1F6FEB; padding:4px 10px; border-radius:8px; font-weight:600;}
  .pbadge.today{background:var(--indigo); color:#fff;}

  .occ-office{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
  .occ-title{font-size:15px; font-weight:800; margin-bottom:2px;}
  .occ-sub{font-size:12px; color:var(--mist); margin-bottom:12px;}
  .occ-bars{display:flex; gap:5px; align-items:flex-end; height:90px;}
  .occ-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end;}
  .occ-bar{width:100%; max-width:56px; border-radius:5px 5px 0 0; background:var(--indigo); min-height:3px;}
  .occ-bar.low{background:#B9D2F5;}
  .occ-bar.full{background:var(--navy);}
  .occ-lbl{font-size:8.5px; color:var(--mist); text-align:center; line-height:1.1;}
  .occ-pct{font-size:8.5px; font-weight:700;}
  .ptable{width:100%; border-collapse:collapse; font-size:13.5px;}
  .ptable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mist); padding:6px 4px; border-bottom:1px solid var(--line);}
  .ptable td{padding:8px 4px; border-bottom:1px solid var(--lavender);}
  .ptable td.r,.ptable th.r{text-align:right;}

  .adm-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
  .adm-card h4{margin:0 0 12px; font-size:15px;}
  .adm-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-size:14px;}
  .adm-row label{flex:1;}
  .adm-row input[type=text],.adm-row input[type=number],.adm-row input[type=time],.adm-row input[type=date],.adm-row input[type=password],.adm-row select{padding:9px 11px; font-size:14px; border:1.5px solid var(--line); border-radius:10px; outline:none; width:150px;}
  .adm-row input[type=number],.adm-row input[type=time]{width:110px; text-align:right;}
  .adm-row input:focus,.adm-row select:focus{border-color:var(--indigo);}
  .switch{position:relative; width:44px; height:25px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.15s; cursor:pointer;}
  .slider:before{content:""; position:absolute; height:19px; width:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--indigo);}
  .switch input:checked + .slider:before{transform:translateX(19px);}

  .tools{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .tools button{font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--navy);}
  .tools button.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .grid-ctl{display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--mist); margin-bottom:10px; flex-wrap:wrap;}
  .grid-ctl button{width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-weight:800;}
  .adm-map .mcell{cursor:pointer;}
  .adm-map .mcell.empty{opacity:.7; border:1.5px dashed var(--line); background:#fff;}
  .with-bg.adm-map .mcell.empty{background:transparent;}
  .kind-tag{font-size:8px; letter-spacing:.5px;}
  .adm-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

const _holidayCache = {};
function easterSunday(y){ // algoritmo de Meeus
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m2=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m2+114)/31), da=((h+l-7*m2+114)%31)+1;
  return new Date(Date.UTC(y, mo-1, da));
}
function holidaysOf(y){
  if(_holidayCache[y]) return _holidayCache[y];
  const set = {};
  const fix = ["01-01","04-25","05-01","06-10","08-15","10-05","11-01","12-01","12-08","12-25","06-13"]; // 13 jun = Lisboa
  fix.forEach(md=>set[y+"-"+md] = 1);
  const E = easterSunday(y);
  const add = (days, label)=>{ const d = new Date(E); d.setUTCDate(d.getUTCDate()+days); set[d.toISOString().slice(0,10)] = 1; };
  add(-2);  // Sexta-feira Santa
  add(0);   // Páscoa (domingo)
  add(60);  // Corpo de Deus
  add(50);  // Segunda do Espírito Santo — Dia dos Açores
  _holidayCache[y] = set;
  return set;
}
function isHoliday(iso){ return !!holidaysOf(parseInt(iso.slice(0,4)))[iso]; }

function workdaysFrom(start, n, dir){
  const out = []; const d = new Date(start);
  while(out.length < n){
    d.setDate(d.getDate() + (dir||1));
    const dow = d.getDay();
    const iso = d.toISOString().slice(0,10);
    if(dow!==0 && dow!==6 && !isHoliday(iso)) out.push({ iso, dow:DIAS[dow], num:d.getDate(), mes:MESES[d.getMonth()] });
  }
  return out;
}
function getDays(){
  const n = Math.max(3, Math.min(60, config.rules.maxAdvanceDays||20));
  const t = new Date(); t.setDate(t.getDate()-1);
  return workdaysFrom(t, n, 1);
}
function pastDays(n){ return workdaysFrom(new Date(), n, -1).reverse(); }
function fmtDate(iso){
  const d = new Date(iso+"T12:00");
  return DIAS_LONG[d.getDay()]+", "+d.getDate()+" "+MESES[d.getMonth()];
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function firstName(n){ return String(n).split(" ")[0]; }
function shortName(n){ const f=firstName(n); return f.length>6 ? f.slice(0,5)+"…" : f; }
function dispName(n, max){ const f=firstName(n); return f.length>max ? f.slice(0,max-1)+"…" : f; }

}

/* ── Derivação do mapa ── */
function derive(office){
  const seats = [];
  let ni=0, nc=0;
  for(let r=0; r<office.rows; r++){
    for(let c=0; c<office.cols; c++){
      const cell = office.cells[r+","+c];
      if(!cell) continue;
      if(cell.kind==="ind"){ ni++; seats.push({id:office.id+"-seat-I"+ni, label:"I"+ni, jan:!!cell.jan, blocked:!!cell.blocked, blockedBy:cell.blockedBy||"", dir:cell.dir||"s", r, c}); }
      else if(cell.kind==="cow"){ nc++; seats.push({id:office.id+"-seat-C"+nc, label:"C"+nc, jan:!!cell.jan, blocked:!!cell.blocked, blockedBy:cell.blockedBy||"", dir:cell.dir||"s", r, c}); }
      /* estacionamento já não vive na planta — ver office.parking */
    }
  }
  const parks = (office.parking||[]).map((p,i)=>({
    id:office.id+"-park-"+(i+1), label:"P"+(i+1),
    blocked:!!p.blocked, blockedBy:p.blockedBy||"",
  }));
  return {seats, parks};
}
function officeOfSpot(spotId){ return config.offices.find(o=>spotId.startsWith(o.id+"-")); }
function baseId(key){ return key.split("|")[0]; }
function periodOf(key){ return key.endsWith("|am") ? "am" : key.endsWith("|pm") ? "pm" : "full"; }
function isSeatKey(key){ return baseId(key).includes("-seat-"); }
function isParkKey(key){ return key.includes("-park-"); }
function describeSpot(key){
  const spotId = baseId(key);
  const o = officeOfSpot(spotId);
  if(!o) return key;
  let base = "";
  if(spotId.includes("-seat-")) base = "Lugar "+spotId.split("-seat-")[1]+" · "+o.name;
  else if(spotId.includes("-park-")) base = "Estacionamento P"+spotId.split("-park-")[1]+" · "+o.name;
  else if(spotId.includes("-room:")){
    const h = HOURS.find(x=>x.id===spotId.split("-room:")[1]);
    return o.room+" · "+(h?h.label:"");
  }
  const p = periodOf(key);
  if(p==="am") base += " · Manhã";
  if(p==="pm") base += " · Tarde";
  return base;
}
function seatDay(day, sid){ return { full:day[sid], am:day[sid+"|am"], pm:day[sid+"|pm"] }; }
function occupantOf(b){ return b.visitor ? b.visitor : b.name; }
function canManage(b){ return b && (b.name===user || b.by===user); }
function isRemote(iso, name){ return !!(remoteDays[iso] && remoteDays[iso][name||user]); }

function migrateOfficeParking(o){
  if(o.parking && o.parking.length) return;
  const found = [];
  const keys = Object.keys(o.cells||{}).sort((a,b)=>{
    const [r1,c1]=a.split(",").map(Number), [r2,c2]=b.split(",").map(Number);
    return r1-r2 || c1-c2;
  });
  keys.forEach(k=>{
    const cell = o.cells[k];
    if(cell && cell.kind==="park"){
      found.push({blocked:!!cell.blocked, blockedBy:cell.blockedBy||""});
      delete o.cells[k];
    }
  });
  o.parking = found.length ? found : [{},{}];
}
function mergeConfig(c){
  const base = defaultConfig();
  return {
    pin: c.pin || base.pin,
    admins: c.admins || [],
    audit: c.audit || [],
    notices: c.notices || {},
    rules: Object.assign(base.rules, c.rules||{}),
    teamDays: c.teamDays || {},
    offices: (c.offices && c.offices.length) ? c.offices.map(o=>{
      const oo = Object.assign({bg:"",bgShow:false,walls:{},diags:{}}, o);
      migrateOfficeParking(oo);
      return oo;
    }) : base.offices,
  };
}

    });
    if(!free){ showToast("Sem lugares livres em "+o.name+" nesse dia"); dateSel = prev; render(); return; }
    const r = tryBook(free.id, iso, "full", {mode:"me"}, null);
    if(r==="ok"){ saveAll(); showToast(describeSpot(free.id)+" — "+fmtDate(iso)); }
    else if(r==="limit"){ showToast("Regra: 1 lugar por pessoa/dia"); }
  }
  dateSel = prev;
  render();
}
function bookPattern(isoList){
  let made = 0;
  isoList.split(",").forEach(iso=>{
    if(habitualValid()){
      const dd = bookings[iso] || {};
      if(!dd[habitualKey()] && tryBook(profile.seatId, iso, profile.period, {mode:"me"}, null)==="ok"){ made++; return; }
    }
    const o = getOffice(officeId);
    const dd = bookings[iso] || {};
    const free = derive(o).seats.find(s=>!s.blocked && !dd[s.id] && !dd[s.id+"|am"] && !dd[s.id+"|pm"]);
    if(free && tryBook(free.id, iso, "full", {mode:"me"}, null)==="ok") made++;
  });
  saveAll(); render();
  showToast(made ? "📈 "+made+" reserva"+(made>1?"s":"")+" criada"+(made>1?"s":"")+" — vê em Minhas" : "Não foi possível reservar (lugares ocupados)");
}
function bookHabitual(){
  if(!habitualValid()) return;
  const day = bookings[dateSel] || {};
  const key = habitualKey();
  const cur = day[key];
  if(cur && canManage(cur)){ cancelSpot(key, dateSel); return; }
  const r = tryBook(profile.seatId, dateSel, profile.period, {mode:"me"}, null);
  if(r==="ok"){ saveAll(); showToast("★ "+describeSpot(key)+" reservado"); }
  else if(r==="limit"){ showToast("Regra: 1 lugar por pessoa/dia — já existe reserva"); }
  else { showToast("O teu lugar habitual já está ocupado neste dia"); }
  render();
}
function quickTargets(){
  if(!habitualValid()) return [];
  const hk = habitualKey(), out = [];
  for(const d of getDays()){
    const dd = bookings[d.iso] || {};
    if(dd[hk]) continue;                                          // lugar já ocupado (por mim ou outro)
    if(Object.entries(dd).some(([k,v])=>isSeatKey(k) && v.name===user && !v.visitor)) continue; // já tenho lugar nesse dia
    out.push(d);
    if(out.length>=3) break;
  }
  return out;
}

/* ── Libertação automática ── */
function runAutoRelease(){
  if(!config.rules.autoRelease) return;
  if(localStorage.getItem(LS_AUTORELEASE)===TODAY) return;
  const T = config.rules.autoReleaseTime || "10:30";
  const toMin = s=>{ const [h,m]=s.split(":").map(Number); return h*60+(m||0); };
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  if(nowMin < toMin(T)) return;
  const pmLimit = Math.max(toMin(T), toMin("14:30"));
  const day = bookings[TODAY];
  if(!day) return;
  let freed = 0;
  Object.entries(day).forEach(([key, b])=>{
    if(!(isSeatKey(key)||isParkKey(key)) || b.checkedIn || b.visitor) return;
    const p = periodOf(key);
    const limit = p==="pm" ? pmLimit : toMin(T);
    if(nowMin >= limit){ delete day[key]; freed++; if(isParkKey(key)) assignFromWaitlist(TODAY, key); }
  });
  localStorage.setItem(LS_AUTORELEASE, TODAY);
  if(freed){
    if(!Object.keys(day).length) delete bookings[TODAY];
    saveAll();
    showToast(freed+" lugar(es) libertado(s) sem check-in");
  }
}

/* ── Reservar / cancelar ── */
function occupantHasSeat(day, person, period){
  return Object.entries(day).some(([k,v])=>{
    if(!isSeatKey(k) || v.visitor) return false;
    if(occupantOf(v)!==person) return false;
    const p = periodOf(k);
    return period==="full" || p==="full" || p===period;
  });
}
function tryBook(spotId, dateIso, period, who, extra){
  const day = bookings[dateIso] || (bookings[dateIso] = {});
  const park = isParkKey(spotId);
  let key;
  if(park || spotId.includes("-room:")){ key = spotId; if(day[key]) return "occupied"; }
  else {
    const st = seatDay(day, spotId);
    if(period==="full"){ if(st.full||st.am||st.pm) return "occupied"; key = spotId; }
    else { if(st.full || st[period]) return "occupied"; key = spotId+"|"+period; }
  }
  const occupant = who.mode==="colleague" ? who.colleague : user;
  if(isSeatKey(key) && config.rules.oneSeatPerDay && who.mode!=="visitor"){
    if(occupantHasSeat(day, occupant, period||"full")) return "limit";
  }
  const b = { name: occupant, ts: Date.now() };
  if(who.mode==="colleague") b.by = user;
  if(who.mode==="visitor"){ b.name = user; b.visitor = who.visitor; }
  if(extra && extra.title) b.title = extra.title;
  day[key] = b;
  return "ok";
}
function cancelSpot(key, dateIso, asAdmin){
  const day = bookings[dateIso];
  if(day && day[key] && (asAdmin || canManage(day[key]))){
    if(asAdmin) logAdmin("cancelou reserva de "+occupantOf(day[key])+" — "+describeSpot(key)+" ("+dateIso+")");
    const wasPark = isParkKey(key);
    delete day[key];
    if(wasPark) assignFromWaitlist(dateIso, key);
    if(!Object.keys(day).length) delete bookings[dateIso];
    saveAll();
    showToast("Reserva cancelada — "+describeSpot(key));
    closeModal(); render();
  }
}
function checkIn(key, dateIso){
  const day = bookings[dateIso];
  if(day && day[key] && day[key].name===user){
    day[key].checkedIn = true;
    saveAll();
    showToast("Check-in feito ✓");
    render();
  }
}

/* ── Lista de espera (estacionamento) ── */
function wlQueue(dateIso, oid){ return ((waitlist[dateIso]||{})[oid]) || []; }
function joinWaitlist(oid){
  const q = (waitlist[dateSel] = waitlist[dateSel] || {});
  const list = (q[oid] = q[oid] || []);
  if(list.some(e=>e.name===user)){ showToast("Já estás na lista de espera"); return; }
  list.push({name:user, ts:Date.now()});
  saveAll();
  showToast("Estás na lista de espera · posição "+list.length);
  render();
}
function leaveWaitlist(oid){
  const list = wlQueue(dateSel, oid);
  const i = list.findIndex(e=>e.name===user);
  if(i>=0){ list.splice(i,1); saveAll(); showToast("Saíste da lista de espera"); render(); }
}
function assignFromWaitlist(dateIso, freedParkKey){
  const o = officeOfSpot(freedParkKey);
  if(!o) return;
  const list = wlQueue(dateIso, o.id);
  if(!list.length) return;
  const next = list.shift();
  const day = bookings[dateIso] || (bookings[dateIso] = {});
  day[freedParkKey] = { name: next.name, ts: Date.now(), by: "lista de espera" };
  showToast("Estacionamento atribuído a "+firstName(next.name)+" (lista de espera)");
}

/* ── Favoritos ── */
function toggleFav(name){
  const i = favs.indexOf(name);
  if(i>=0) favs.splice(i,1); else favs.push(name);
  saveFavs();
  render();
}

function rsToggle(hid){
  const m = modalState;
  const idx = HOURS.findIndex(h=>h.id===hid);
  const idxs = m.selArr.map(id=>HOURS.findIndex(h=>h.id===id)).sort((a,b)=>a-b);
  const inp = document.getElementById("rsTitle");
  if(inp) m.title = inp.value;
  if(m.selArr.includes(hid)){
    // remover só se for extremo da sequência
    if(idx===idxs[0] || idx===idxs[idxs.length-1]){
      m.selArr = m.selArr.filter(id=>id!==hid);
    } else { showToast("Remove primeiro as horas dos extremos"); return; }
  } else {
    if(idxs.length && idx!==idxs[0]-1 && idx!==idxs[idxs.length-1]+1){
      showToast("Escolhe horas seguidas"); return;
    }
    m.selArr.push(hid);
  }
  renderModal();
}
function rsConfirm(){
  const m = modalState;
  const inp = document.getElementById("rsTitle");
  const title = inp ? inp.value.trim() : "";
  let made = 0;
  m.selArr.forEach(hid=>{
    const key = m.oid+"-room:"+hid;
    if(tryBook(key, dateSel, null, {mode:"me"}, title?{title}:null)==="ok") made++;
  });
  saveAll();
  const office = getOffice(m.oid);
  showToast(made ? made+" hora(s) reservada(s) — "+esc(office.room) : "Horas já ocupadas");
  m.selArr = []; m.title = "";
  render(); renderModal();
}
function rsCancel(key){
  const day = bookings[dateSel];

    delete day[key];

    saveAll();
    showToast("Reserva cancelada — "+describeSpot(key));
    render(); renderModal();
  }
}

  const targets = [dateSel];

/* ── .ics ── */
function meetingNote(key, dateIso){
  const b = (bookings[dateIso]||{})[key];
  const o = officeOfSpot(baseId(key));
  const h = HOURS.find(x=>x.id===baseId(key).split("-room:")[1]);
  const txt = "Ata de reunião — "+(b&&b.title ? b.title : "Reunião")+"\n" +
    "Data: "+fmtDate(dateIso)+" · "+(h?h.label:"")+"\n" +
    "Local: "+(o?o.room+" · Escritório "+o.name:"")+"\n" +
    "Organizador: "+(b?b.name:user)+"\n" +
    "Participantes: \n\n" +
    "Agenda:\n- \n\n" +
    "Decisões:\n- \n\n" +
    "Ações (quem · o quê · quando):\n- ";
  const open = ()=>window.open(DIGINOTE_URL, "_blank");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{
      showToast("📝 Modelo de ata copiado — cola numa nova nota do DigiNote");
      open();
    }).catch(()=>{ open(); });
  } else open();
}
function exportIcs(key, dateIso){
  const desc = describeSpot(key);
  const b = (bookings[dateIso]||{})[key];
  const p = periodOf(key);
  let dtStart, dtEnd;
  const spotId = baseId(key);
  if(spotId.includes("-room:")){
    const h = HOURS.find(x=>x.id===spotId.split("-room:")[1]);
    dtStart = dateIso.replace(/-/g,"")+"T"+String(h.h).padStart(2,"0")+"0000";
    dtEnd   = dateIso.replace(/-/g,"")+"T"+String(h.h+1).padStart(2,"0")+"0000";
  } else {
    const s = p==="pm" ? "13" : "09", e = p==="am" ? "13" : "18";
    dtStart = dateIso.replace(/-/g,"")+"T"+s+"0000";
    dtEnd   = dateIso.replace(/-/g,"")+"T"+e+"0000";
  }
  const summary = (b && b.title) ? b.title+" — "+desc : "DigiSpot: "+desc;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Digit//DigiSpot//PT","BEGIN:VEVENT",
    "UID:"+key+"-"+dateIso+"@digispot.digit","DTSTART:"+dtStart,"DTEND:"+dtEnd,
    "SUMMARY:"+summary,"LOCATION:Digit — Escritório "+((officeOfSpot(spotId)||{}).name||""),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "digispot-"+dateIso+".ics";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── CSV ── */
function exportCsv(){
  const rows = [["data","escritorio","espaco","periodo","ocupante","reservado_por","visitante","assunto","checkin"]];
  Object.keys(bookings).sort().forEach(dateIso=>{
    Object.entries(bookings[dateIso]).forEach(([key, b])=>{
      const o = officeOfSpot(baseId(key));
      rows.push([dateIso, o?o.name:"", describeSpot(baseId(key)), periodOf(key), occupantOf(b), b.by||b.name, b.visitor||"", b.title||"", b.checkedIn?"sim":"nao"]);
    });
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "digispot-reservas.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

    localStorage.setItem(LS_LOGIN, JSON.stringify({email:em}));

async function enterAs(n, em){
  let names = {}; try{ names = JSON.parse(localStorage.getItem(LS_NAMES))||{}; }catch(e){}

  user = n; localStorage.setItem(LS_USER, n);

async function login(){
  const rawEl = document.getElementById("emailInput");
  const em = fullEmail(rawEl.value);
  const local = em.split("@")[0];
  const pw = document.getElementById("passInput").value||"";
  if(!rawEl.value.trim()){ showToast("Escreve o teu email"); return; }
  if(!pw){ showToast("Escreve a palavra-passe"); return; }

  /* Sem Supabase (offline / CDN bloqueado): entra em modo local pelo nome */
  if(!SB){
    let names={}; try{ names=JSON.parse(localStorage.getItem(LS_NAMES))||{}; }catch(e){}
    const step = document.getElementById("nameStep");
    if(!names[local] && step.style.display==="none"){
      step.style.display="block";
      const ni=document.getElementById("nameInput"); ni.value=nameFromEmail(local); ni.focus(); ni.select(); return;
    }
    const n = names[local] || (document.getElementById("nameInput").value||"").trim() || nameFromEmail(local);
    saveLoginPrefs(em); enterAs(n, local); return;
  }

  const btn = document.querySelector(".login-card .btn-primary");
  if(btn){ btn.disabled=true; btn.textContent="A entrar…"; }
  try{
    const { data, error } = await SB.auth.signInWithPassword({ email: em, password: pw });
    if(error){
      /* O login de conta pode falhar, mas a sincronização na nuvem não depende dele:
         a app lê/grava sempre pela nuvem. Aqui só identificamos a pessoa pelo email. */
      saveLoginPrefs(em);
      let names={}; try{ names=JSON.parse(localStorage.getItem(LS_NAMES))||{}; }catch(e){}
      enterAs(names[local] || nameFromEmail(local), local);
      return;
    }
    saveLoginPrefs(em);
    let n = authName(data.user);
    /* Sem nome no perfil da conta → pede uma vez e grava na conta (partilhado com o DigiNote) */
    const m = (data.user.user_metadata)||{};
    if(!m.full_name && !m.name && !m.display_name){
      const step = document.getElementById("nameStep");
      if(step && step.style.display==="none"){
        step.style.display="block";
        const ni=document.getElementById("nameInput"); ni.value=nameFromEmail(local); ni.focus(); ni.select();
        if(btn){ btn.disabled=false; btn.textContent="Confirmar e entrar"; }
        return;
      }
      const typed = (document.getElementById("nameInput").value||"").trim();
      if(typed){ n = typed; try{ await SB.auth.updateUser({ data:{ full_name:n } }); }catch(e){} }
    }
    enterAs(n, local);
  } finally {
    if(btn){ btn.disabled=false; btn.textContent="Entrar"; }
  }
}
async function signUp(){
  if(!SB){ showToast("Sem ligação — cria a conta no DigiNote primeiro"); return; }
  const raw = document.getElementById("emailInput");
  const em = fullEmail(raw && raw.value);
  const pw = document.getElementById("passInput").value||"";
  if(!raw || !raw.value.trim() || !pw){ showToast("Preenche email e palavra-passe (mín. 6) para criar conta"); return; }
  const { error } = await SB.auth.signUp({ email: em, password: pw, options:{ data:{ full_name: nameFromEmail(em.split("@")[0]) } } });
  if(error){ showToast(error.message); return; }
  showToast("✓ Conta criada — confirma o email e depois entra");
}
async function forgotPass(){
  if(!SB){ showToast("Recuperação disponível online"); return; }
  const raw = document.getElementById("emailInput");
  if(!raw || !raw.value.trim()){ showToast("Escreve o teu email primeiro"); return; }
  const { error } = await SB.auth.resetPasswordForEmail(fullEmail(raw.value));
  showToast(error ? error.message : "✉️ Enviámos um link de recuperação para o teu email");
}
async function logout(){
  if(SB){ try{ await SB.auth.signOut(); }catch(e){} }
  user=""; adminUnlocked=false; view="book"; localStorage.removeItem(LS_USER);
  authEmail=""; localStorage.removeItem(LS_EMAIL);
  renderNav(); render();
}
async function restoreSession(){
  if(!SB) return;
  try{
    const { data } = await SB.auth.getSession();
    if(data && data.session && data.session.user){
      const u = data.session.user;
      user = authName(u); localStorage.setItem(LS_USER, user);
      authEmail = (u.email||"").toLowerCase(); localStorage.setItem(LS_EMAIL, authEmail);
      let names={}; try{ names=JSON.parse(localStorage.getItem(LS_NAMES))||{}; }catch(e){}
      names[(u.email||"").split("@")[0]] = user; localStorage.setItem(LS_NAMES, JSON.stringify(names));
    } else {
      user = ""; localStorage.removeItem(LS_USER);
    }
  }catch(e){}
}

function mapHtml(office, opts){
  const CS = 58, PAD = 10;
  const GUT = opts.admin ? 22 : 0; // goteira para os controlos de linhas/colunas
  const W = office.cols*CS + PAD*2 + GUT, H = office.rows*CS + PAD*2 + GUT;
  const day = bookings[dateSel] || {};
  const {seats, parks} = derive(office);
  const byPos = {};
  seats.forEach(s=>byPos[s.r+","+s.c]=Object.assign({t:"seat"},s));
  // parques: desenhados no parque dedicado, não na planta

  const COL = { free:"#3E9E70", other:"#8B97A5", mine:"#1F6FEB", deskFree:"#FFFFFF", deskOther:"#E9EDF2", deskMine:"#1F6FEB", stroke:"#CBD5E0", wall:"#16233A" };
  const cx = c => PAD + GUT + c*CS, cy = r => PAD + GUT + r*CS;
  let topLayer = ""; // nomes e legendas — desenhados por cima de paredes e mobiliário

  function statusDot(x, y, stAm, stPm){
    if(stAm===stPm){
      return '<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+COL[stAm]+'" stroke="#fff" stroke-width="1.6"/>';
    }
    return '<path d="M '+x+' '+(y-5.5)+' A 5.5 5.5 0 0 0 '+x+' '+(y+5.5)+' Z" fill="'+COL[stAm]+'"/>' +
           '<path d="M '+x+' '+(y-5.5)+' A 5.5 5.5 0 0 1 '+x+' '+(y+5.5)+' Z" fill="'+COL[stPm]+'"/>' +
           '<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="none" stroke="#fff" stroke-width="1.6"/>';
  }
  function paintAttrs(fn){
    /* atributos de clique + pintura por arrasto (só editor) */
    return ' onmousedown="admPaintDown();'+fn+'" onmouseover="if(admPainting)'+fn+'" onclick="if(admClickOK())'+fn+'" style="cursor:pointer"';

  let el = "";
  const roomCells = [];

  /* ── células ── */
